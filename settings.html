<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설정</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-home.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F8FD">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<script src="https://unpkg.com/feather-icons"></script>
<style>
:root { --bg:#F2F8FD; --card:#FFFFFF; --ink:#22303C; --sub:#64748B; --line:#D8E6F2; --acc:#1E90FF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; } }
:root[data-theme="dark"] { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; margin:0; padding:20px; display:flex; flex-direction:column; align-items:center; }
.header { width:100%; max-width:560px; margin-bottom:24px; display:flex; align-items:center; gap:12px; }
.back-btn { width:40px; height:40px; border:1.5px solid var(--line); background:var(--card); border-radius:99px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); }
.back-btn:active { transform:scale(.95); }
h1 { font-family:'Jua',sans-serif; font-weight:400; font-size:32px; margin:0; flex:1; }
.menu { background:var(--card); border:2px solid var(--line); border-radius:20px; width:100%; max-width:560px; overflow:hidden; }
.item { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; cursor:pointer; transition:background .12s; }
.item:last-child { border-bottom:none; }
.item:active { background:var(--line); }
.item-icon { width:24px; height:24px; flex-shrink:0; color:var(--acc); }
.item-text { flex:1; }
.item-label { font-weight:700; font-size:15px; }
.item-sub { font-size:13px; color:var(--sub); margin-top:2px; }
.item-toggle { width:48px; height:28px; border-radius:14px; background:var(--line); position:relative; cursor:pointer; border:none; padding:0; }
.item-toggle.on { background:var(--acc); }
.item-toggle::after { content:''; position:absolute; width:24px; height:24px; border-radius:12px; background:white; top:2px; left:2px; transition:left .2s; }
.item-toggle.on::after { left:22px; }
.logout-item { background:#D6453D20; color:var(--acc); }
.logout-item:active { background:#D6453D40; }
</style>
</head>
<body>
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<div class="header">
  <button class="back-btn" onclick="goBack()"><svg data-feather="chevron-left" width="20" height="20"></svg></button>
  <h1>설정</h1>
  <a href="index.html" class="back-btn" title="처음으로" style="text-decoration:none; flex:0 0 40px;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
</div>

<div class="menu">
  <div class="item" onclick="toggleTheme()">
    <svg class="item-icon" data-feather="sun" width="20" height="20"></svg>
    <div class="item-text">
      <div class="item-label">어두운 테마</div>
      <div class="item-sub" id="themeDesc">지금은 밝은 테마 · 모든 화면에 바로 적용돼요</div>
    </div>
    <button class="item-toggle" id="themeToggle" onclick="event.stopPropagation(); toggleTheme()"></button>
  </div>

  <div class="item" onclick="togglePwForm()">
    <svg class="item-icon" data-feather="key" width="20" height="20"></svg>
    <div class="item-text">
      <div class="item-label">비밀번호 변경</div>
      <div class="item-sub">현재 비밀번호 확인 후 변경</div>
    </div>
  </div>

  <div id="pwForm" style="display:none; padding:16px 20px; border-bottom:1px solid var(--line); background:var(--bg);">
    <input type="password" id="pwCurrent" placeholder="현재 비밀번호" maxlength="30" autocapitalize="none" autocorrect="off"
      style="width:100%; padding:11px; border:1.5px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); font-family:'Noto Sans KR',sans-serif; font-size:14px; margin-bottom:8px; box-sizing:border-box;">
    <input type="password" id="pwNew" placeholder="새 비밀번호 (최소 6자리)" maxlength="30" autocapitalize="none" autocorrect="off"
      style="width:100%; padding:11px; border:1.5px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); font-family:'Noto Sans KR',sans-serif; font-size:14px; margin-bottom:8px; box-sizing:border-box;">
    <input type="password" id="pwNew2" placeholder="새 비밀번호 확인" maxlength="30" autocapitalize="none" autocorrect="off"
      style="width:100%; padding:11px; border:1.5px solid var(--line); border-radius:12px; background:var(--card); color:var(--ink); font-family:'Noto Sans KR',sans-serif; font-size:14px; margin-bottom:10px; box-sizing:border-box;">
    <button onclick="changePassword()"
      style="width:100%; padding:11px; border:none; border-radius:99px; background:var(--acc); color:#fff; font-weight:700; font-size:14px; cursor:pointer; font-family:'Noto Sans KR',sans-serif;">변경하기</button>
    <div id="pwMsg" style="font-size:12.5px; margin-top:8px; text-align:center; color:var(--sub);"></div>
  </div>

  <div class="item" onclick="location.href='planner-print.html'">
    <svg class="item-icon" data-feather="printer" width="20" height="20"></svg>
    <div class="item-text">
      <div class="item-label">인쇄용 주간 플래너</div>
      <div class="item-sub">일정을 짜서 PNG·PDF로 뽑는 지면 만들기</div>
    </div>
  </div>

  <div class="item logout-item" onclick="handleLogout()">
    <svg class="item-icon" data-feather="log-out" width="20" height="20"></svg>
    <div class="item-text">
      <div class="item-label">로그아웃</div>
      <div class="item-sub">계정에서 나가기</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAy889tWquig05QYOEphozzlaTbfiPIbyc",
  authDomain: "halo-kids.firebaseapp.com",
  databaseURL: "https://halo-kids-default-rtdb.firebaseio.com",
  projectId: "halo-kids",
  storageBucket: "halo-kids.firebasestorage.app",
  messagingSenderId: "148528901393",
  appId: "1:148528901393:web:32256a8df7bff9417b30b0"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

window.addEventListener('load', () => {
  const userId = localStorage.getItem('currentUser');
  if (!userId) {
    window.location.href = 'login.html';
    return;
  }

  // 토글 상태 표시 (테마 자체는 body 첫 스크립트에서 이미 복원됨)
  const attr = document.documentElement.getAttribute('data-theme');
  const isDark = attr ? attr === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

  if (isDark) {
    document.getElementById('themeToggle').classList.add('on');
    document.getElementById('themeDesc').textContent = '지금은 어두운 테마 · 모든 화면에 바로 적용돼요';
  }

  feather.replace();
});

function toggleTheme() {
  const html = document.documentElement;
  const attr = html.getAttribute('data-theme');
  const isDark = attr ? attr === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = isDark ? 'light' : 'dark';
  const toggle = document.getElementById('themeToggle');
  const desc = document.getElementById('themeDesc');

  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  toggle.classList.toggle('on', next === 'dark');
  desc.textContent = next === 'dark' ? '지금은 어두운 테마 · 모든 화면에 바로 적용돼요' : '지금은 밝은 테마 · 모든 화면에 바로 적용돼요';
}

async function handleLogout() {
  try {
    const userId = localStorage.getItem('currentUser');

    // 활동 로그
    if (userId) {
      await db.ref(`userActivity/${userId}`).push({
        action: 'logout',
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
    }

    await auth.signOut();
    localStorage.removeItem('currentUser');
    localStorage.removeItem('username');
    window.location.href = 'login.html';
  } catch (error) {
    alert('로그아웃 실패했습니다');
  }
}

function goBack() {
  history.back();
}

function togglePwForm() {
  const f = document.getElementById('pwForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

async function changePassword() {
  const msg = document.getElementById('pwMsg');
  const cur = document.getElementById('pwCurrent').value;
  const nw = document.getElementById('pwNew').value;
  const nw2 = document.getElementById('pwNew2').value;

  if (!cur) { msg.textContent = '현재 비밀번호를 입력하세요'; return; }
  if (nw.length < 5) { msg.textContent = '새 비밀번호는 최소 6자리입니다'; return; }
  if (nw !== nw2) { msg.textContent = '새 비밀번호가 일치하지 않습니다'; return; }

  msg.textContent = '변경 중...';
  try {
    const username = localStorage.getItem('username');
    const email = `${username}@halo-kids.local`;
    // 세션이 만료됐을 수 있으므로 현재 비밀번호로 재로그인 후 변경
    const cred = await auth.signInWithEmailAndPassword(email, cur);
    await cred.user.updatePassword(nw);

    const userId = localStorage.getItem('currentUser');
    await db.ref(`userActivity/${userId}`).push({
      action: 'change_password',
      timestamp: firebase.database.ServerValue.TIMESTAMP
    });

    msg.textContent = '변경되었습니다!';
    document.getElementById('pwCurrent').value = '';
    document.getElementById('pwNew').value = '';
    document.getElementById('pwNew2').value = '';
    setTimeout(() => { document.getElementById('pwForm').style.display = 'none'; msg.textContent = ''; }, 1500);
  } catch (e) {
    if (e.code === 'auth/wrong-password' || e.code === 'auth/invalid-credential') {
      msg.textContent = '현재 비밀번호가 틀렸습니다';
    } else if (e.code === 'auth/weak-password') {
      msg.textContent = '새 비밀번호가 너무 단순합니다 (6자 이상 권장)';
    } else {
      msg.textContent = '변경에 실패했습니다: ' + (e.code || '');
    }
  }
}
</script>
</body>
</html>
