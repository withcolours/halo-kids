<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>설정</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-home.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F8FD">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<script src="https://unpkg.com/feather-icons"></script>
<style>
:root { --bg:#F2F8FD; --card:#FFFFFF; --ink:#22303C; --sub:#64748B; --line:#D8E6F2; --acc:#1E90FF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; } }
:root[data-theme="dark"] { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; margin:0; padding:20px; display:flex; flex-direction:column; align-items:center; }
.header { width:100%; max-width:560px; margin-bottom:24px; display:flex; align-items:center; gap:12px; }
.back-btn { width:40px; height:40px; border:1.5px solid var(--line); background:var(--card); border-radius:99px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); }
.back-btn:active { transform:scale(.95); }
h1 { font-family:'Jua',sans-serif; font-weight:400; font-size:32px; margin:0; flex:1; }
.menu { background:var(--card); border:2px solid var(--line); border-radius:20px; width:100%; max-width:560px; overflow:hidden; }
.item { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:12px; cursor:pointer; transition:background .12s; }
.item:last-child { border-bottom:none; }
.item:active { background:var(--line); }
.item-icon { width:24px; height:24px; flex-shrink:0; color:var(--acc); }
.item-text { flex:1; }
.item-label { font-weight:700; font-size:15px; }
.item-sub { font-size:13px; color:var(--sub); margin-top:2px; }
.item-toggle { width:48px; height:28px; border-radius:14px; background:var(--line); position:relative; cursor:pointer; border:none; padding:0; }
.item-toggle.on { background:var(--acc); }
.item-toggle::after { content:''; position:absolute; width:24px; height:24px; border-radius:12px; background:white; top:2px; left:2px; transition:left .2s; }
.item-toggle.on::after { left:22px; }
.logout-item { background:#D6453D20; color:var(--acc); }
.logout-item:active { background:#D6453D40; }
</style>
</head>
<body>
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<div class="header">
  <button class="back-btn" onclick="goBack()"><svg data-feather="chevron-left" width="20" height="20"></svg></button>
  <h1>설정</h1>
</div>

<div class="menu">
  <div class="item" onclick="toggleTheme()">
    <svg class="item-icon" data-feather="sun" width="20" height="20"></svg>
    <div class="item-text">
      <div class="item-label">어두운 테마</div>
      <div class="item-sub" id="themeDesc">밝음</div>
    </div>
    <button class="item-toggle" id="themeToggle" onclick="event.stopPropagation()"></button>
  </div>

  <div class="item logout-item" onclick="handleLogout()">
    <svg class="item-icon" data-feather="log-out" width="20" height="20"></svg>
    <div class="item-text">
      <div class="item-label">로그아웃</div>
      <div class="item-sub">계정에서 나가기</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAy889tWquig05QYOEphozzlaTbfiPIbyc",
  authDomain: "halo-kids.firebaseapp.com",
  databaseURL: "https://halo-kids-default-rtdb.firebaseio.com",
  projectId: "halo-kids",
  storageBucket: "halo-kids.firebasestorage.app",
  messagingSenderId: "148528901393",
  appId: "1:148528901393:web:32256a8df7bff9417b30b0"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

window.addEventListener('load', () => {
  const userId = localStorage.getItem('currentUser');
  if (!userId) {
    window.location.href = 'login.html';
    return;
  }

  // 토글 상태 표시 (테마 자체는 body 첫 스크립트에서 이미 복원됨)
  const attr = document.documentElement.getAttribute('data-theme');
  const isDark = attr ? attr === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;

  if (isDark) {
    document.getElementById('themeToggle').classList.add('on');
    document.getElementById('themeDesc').textContent = '어둠';
  }

  feather.replace();
});

function toggleTheme() {
  const html = document.documentElement;
  const attr = html.getAttribute('data-theme');
  const isDark = attr ? attr === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = isDark ? 'light' : 'dark';
  const toggle = document.getElementById('themeToggle');
  const desc = document.getElementById('themeDesc');

  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  toggle.classList.toggle('on', next === 'dark');
  desc.textContent = next === 'dark' ? '어둠' : '밝음';
}

async function handleLogout() {
  try {
    const userId = localStorage.getItem('currentUser');

    // 활동 로그
    if (userId) {
      await db.ref(`userActivity/${userId}`).push({
        action: 'logout',
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
    }

    await auth.signOut();
    localStorage.removeItem('currentUser');
    localStorage.removeItem('username');
    window.location.href = 'login.html';
  } catch (error) {
    alert('로그아웃 실패했습니다');
  }
}

function goBack() {
  history.back();
}
</script>
</body>
</html>
