<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>과제</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-home.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F8FD">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root { --bg:#F2F8FD; --card:#FFFFFF; --ink:#22303C; --sub:#64748B; --line:#D8E6F2; --acc:#1E90FF; --ok:#2E9E5B; --gold:#C99A16; --warn:#E0742C; --bad:#D6453D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; } }
:root[data-theme="dark"] { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; margin:0; padding:18px 16px 60px; display:flex; flex-direction:column; align-items:center; }
.header { width:100%; max-width:560px; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
.hbtn { width:40px; height:40px; border:1.5px solid var(--line); background:var(--card); border-radius:99px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); flex:0 0 40px; text-decoration:none; }
.hbtn:active { transform:scale(.95); }
h1 { font-family:'Jua',sans-serif; font-weight:400; font-size:26px; margin:0; flex:1; }
.svgi { width:20px; height:20px; }
main { width:100%; max-width:560px; }
.quick { display:flex; gap:7px; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:9px; margin-bottom:6px; }
.quick input[type="text"] { flex:1; min-width:0; border:none; background:transparent; color:var(--ink); font-family:inherit; font-size:14.5px; padding:8px 6px; outline:none; }
.quick input[type="text"]::placeholder { color:var(--sub); }
.quick input[type="date"] { border:1.5px solid var(--line); background:var(--bg); color:var(--ink); font-family:inherit; font-size:12.5px; border-radius:10px; padding:6px 8px; outline:none; color-scheme:light dark; }
.quick button { border:none; border-radius:12px; padding:8px 16px; font-size:13.5px; font-weight:700; font-family:inherit; cursor:pointer; background:var(--acc); color:#fff; white-space:nowrap; display:flex; align-items:center; gap:5px; }
.quick button:disabled { background:var(--line); color:var(--sub); cursor:default; }
.quick button svg { width:15px; height:15px; }
.sect { font-size:12.5px; font-weight:700; color:var(--sub); margin:20px 0 8px; display:flex; align-items:center; gap:6px; }
.sect svg { width:15px; height:15px; }
.sect.late { color:var(--bad); }
.task { display:flex; align-items:center; gap:11px; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:11px 13px; margin-bottom:8px; }
.task .cb { width:27px; height:27px; border-radius:99px; border:2px solid var(--line); flex:0 0 27px; display:flex; align-items:center; justify-content:center; color:#fff; background:transparent; cursor:pointer; padding:0; transition:background .15s; -webkit-tap-highlight-color:transparent; }
.task .cb svg { width:15px; height:15px; }
.task .cb:active { transform:scale(.92); }
.task .tx { flex:1; min-width:0; }
.task .tt { font-size:14.5px; font-weight:700; line-height:1.4; word-break:break-word; }
.task .dd { font-size:11.5px; color:var(--sub); margin-top:1px; }
.task.done { border-color:var(--ok); opacity:.85; }
.task.done .cb { background:var(--ok); border-color:var(--ok); }
.task.done .tt { color:var(--sub); text-decoration:line-through; text-decoration-thickness:1.5px; }
.task.late { border-color:var(--bad); }
.badge { font-size:11px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap; border:1px solid var(--sub); color:var(--sub); background:transparent; }
.badge.late { background:#D6453D22; color:var(--bad); border-color:var(--bad); }
.badge.today { background:#E0742C22; color:var(--warn); border-color:var(--warn); }
.del { border:1.5px solid var(--line); background:var(--card); color:var(--sub); border-radius:99px; width:30px; height:30px; flex:0 0 30px; display:flex; align-items:center; justify-content:center; cursor:pointer; padding:0; }
.del svg { width:14px; height:14px; }
.del:active { color:var(--bad); border-color:var(--bad); }
.empty2 { font-size:13px; color:var(--sub); text-align:center; padding:18px 0; }
.skel { color:var(--sub); font-size:13px; text-align:center; padding:30px 0; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#1f2937; color:#fff; border-radius:12px; padding:11px 16px; font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:99; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>

<div class="header">
  <button class="hbtn" onclick="history.back()" aria-label="뒤로"><svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
  <h1>과제</h1>
  <a href="today.html" class="hbtn" title="오늘"><svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><path d="M8 14l3 3 5-6"/></svg></a>
  <a href="index.html" class="hbtn" title="처음으로"><svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
</div>

<main>
  <div class="quick">
    <input type="text" id="qTitle" placeholder="무슨 과제가 있나요?" maxlength="80">
    <input type="date" id="qDue" aria-label="마감일">
    <button id="qAdd" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>추가</button>
  </div>

  <div id="lists"><div class="skel">불러오는 중…</div></div>
</main>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAy889tWquig05QYOEphozzlaTbfiPIbyc",
  authDomain: "halo-kids.firebaseapp.com",
  databaseURL: "https://halo-kids-default-rtdb.firebaseio.com",
  projectId: "halo-kids",
  storageBucket: "halo-kids.firebasestorage.app",
  messagingSenderId: "148528901393",
  appId: "1:148528901393:web:32256a8df7bff9417b30b0"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY = () => ymd(new Date());
function addDays(dstr,n){ const d=new Date(dstr+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); }
function dayDiff(a,b){ return Math.round((new Date(a+'T00:00:00')-new Date(b+'T00:00:00'))/86400000); } // a-b (일)
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c)); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2600); }

const DOWN=['일','월','화','수','목','금','토'];
function dueLabel(dstr){
  const d=new Date(dstr+'T00:00:00');
  if(isNaN(d)) return dstr;
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOWN[d.getDay()]})`;
}
function badgeFor(due){
  const diff=dayDiff(due,TODAY()); // 음수=지남
  if(diff<0)  return `<span class="badge late">D+${-diff}</span>`;
  if(diff===0)return `<span class="badge today">오늘!</span>`;
  return `<span class="badge">D-${diff}</span>`;
}

const CHECK_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const TRASH_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>';
const ALERT_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
const LIST_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>';
const DONE_SVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.27"/></svg>';

let uid=null, tasks={};

function taskRow(id,t,section){
  const done=!!t.doneAt;
  const cls=['task',done?'done':'',section==='late'?'late':''].filter(Boolean).join(' ');
  const badge=done?'':badgeFor(t.due);
  return `<div class="${cls}" data-id="${esc(id)}">
    <button class="cb" data-toggle="${esc(id)}" role="checkbox" aria-checked="${done}" aria-label="${done?'완료 취소':'완료'}">${done?CHECK_SVG:''}</button>
    <span class="tx"><div class="tt">${esc(t.title)}</div><div class="dd">${esc(dueLabel(t.due))}까지</div></span>
    ${badge}
    <button class="del" data-del="${esc(id)}" aria-label="삭제">${TRASH_SVG}</button>
  </div>`;
}

function render(){
  const today=TODAY();
  const entries=Object.entries(tasks).filter(([,t])=>t&&t.title&&t.due);
  const late=entries.filter(([,t])=>!t.doneAt&&t.due<today).sort((a,b)=>a[1].due<b[1].due?-1:a[1].due>b[1].due?1:(a[1].createdAt||0)-(b[1].createdAt||0));
  const open=entries.filter(([,t])=>!t.doneAt&&t.due>=today).sort((a,b)=>a[1].due<b[1].due?-1:a[1].due>b[1].due?1:(a[1].createdAt||0)-(b[1].createdAt||0));
  const done=entries.filter(([,t])=>t.doneAt).sort((a,b)=>(b[1].doneAt||0)-(a[1].doneAt||0)).slice(0,10);

  let html='';
  if(late.length){
    html+=`<div class="sect late">${ALERT_SVG}밀린 과제</div>`;
    html+=late.map(([id,t])=>taskRow(id,t,'late')).join('');
  }
  html+=`<div class="sect">${LIST_SVG}할 과제</div>`;
  html+=open.length?open.map(([id,t])=>taskRow(id,t,'open')).join(''):'<div class="empty2">할 과제가 없어요. 위에서 추가해 보세요.</div>';
  html+=`<div class="sect">${DONE_SVG}끝낸 과제</div>`;
  html+=done.length?done.map(([id,t])=>taskRow(id,t,'done')).join(''):'<div class="empty2">아직 끝낸 과제가 없어요.</div>';
  $('lists').innerHTML=html;
}

async function addTask(){
  const title=$('qTitle').value.trim();
  const due=$('qDue').value;
  if(!title){ toast('과제 이름을 적어 주세요.'); $('qTitle').focus(); return; }
  if(!/^\d{4}-\d{2}-\d{2}$/.test(due)){ toast('마감 날짜를 골라 주세요.'); return; }
  const btn=$('qAdd'); btn.disabled=true;
  try{
    const key=db.ref(`userTasks/${uid}`).push().key;
    await db.ref(`userTasks/${uid}/${key}`).set({ title, due, createdAt:firebase.database.ServerValue.TIMESTAMP });
    tasks[key]={ title, due, createdAt:Date.now() };
    $('qTitle').value='';
    render();
    toast('과제를 추가했어요.');
    $('qTitle').focus();
  }catch(e){ toast('추가 실패: '+(e.code||e.message)); }
  finally{ btn.disabled=false; }
}

document.addEventListener('click', async e=>{
  const tg=e.target.closest('[data-toggle]');
  if(tg){
    const id=tg.dataset.toggle, t=tasks[id];
    if(!t)return;
    const ref=db.ref(`userTasks/${uid}/${id}/doneAt`);
    try{
      if(t.doneAt){ delete t.doneAt; await ref.remove(); }
      else{ t.doneAt=Date.now(); await ref.set(firebase.database.ServerValue.TIMESTAMP); }
      render();
    }catch(err){ toast('저장 실패: '+(err.code||err.message)); }
    return;
  }
  const dl=e.target.closest('[data-del]');
  if(dl){
    const id=dl.dataset.del, t=tasks[id];
    if(!t)return;
    if(!confirm(`'${t.title}' 과제를 지울까요?`))return;
    try{ await db.ref(`userTasks/${uid}/${id}`).remove(); delete tasks[id]; render(); toast('지웠어요.'); }
    catch(err){ toast('삭제 실패: '+(err.code||err.message)); }
  }
});

$('qAdd').onclick=addTask;
$('qTitle').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.isComposing){ e.preventDefault(); addTask(); } });
$('qDue').value=addDays(TODAY(),1); // 기본값: 내일

if(!localStorage.getItem('currentUser')){
  window.location.href='login.html';
}else{
  auth.onAuthStateChanged(async user=>{
    if(!user){ window.location.href='login.html'; return; }
    uid=user.uid;
    try{
      const s=await db.ref(`userTasks/${uid}`).once('value');
      tasks=s.val()||{};
      render();
    }catch(e){
      const msg=(e&&(e.code||e.message))||String(e);
      $('lists').innerHTML='<div class="empty2">'+(/permission/i.test(msg)?'보안 규칙이 아직 게시되지 않았어요 — 게시 후 새로고침해 주세요.':'불러오지 못했어요: '+esc(msg))+'</div>';
    }
  });
}
</script>
</body>
</html>
