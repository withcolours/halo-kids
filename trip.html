<style>

.stack { display:flex; flex-direction:column; gap:14px; }

.left { width:400px; flex-shrink:0; }

.map .sea{fill:#DCEEFB}.map .land{fill:#F4F1E4;stroke:#C9C2A6;stroke-width:1}.map .land.id{fill:#FBE3DF;stroke:#E8A79E}.map .bali{fill:#E8453C}
.map .eq{stroke:#E8453C;stroke-width:1.5;stroke-dasharray:6 5}.map .eqt{fill:#E8453C;font-size:13px}

.fxbig { font-family:'Jua',sans-serif; font-size:28px; font-variant-numeric:tabular-nums; }
.opt { cursor:pointer; min-height:40px; }
.opt.right { background:var(--okbg); border-color:var(--ok); color:var(--ok); }

.stars { color:var(--yel); font-size:20px; letter-spacing:2px; }
.entry { border-top:1px solid var(--line); padding:14px 0; }

.list { display:grid; gap:14px; max-width:640px; }
a.tcard { display:flex; align-items:center; gap:16px; background:var(--card); border:2px solid var(--line); border-radius:18px; padding:22px; text-decoration:none; color:var(--ink); }
a.tcard .t { font-family:'Jua',sans-serif; font-size:24px; }
.err { color:var(--red); font-size:14px; line-height:1.6; }
.okmsg { color:var(--ok); font-size:14px; line-height:1.6; }
code { background:var(--bg); padding:1px 5px; border-radius:5px; font-size:12.5px; }
.skel { color:var(--sub); font-size:14px; text-align:center; padding:40px 0; }

.plan { margin-top:10px; display:grid; gap:0; }
.plan div { display:flex; gap:12px; padding:7px 0; border-top:1px dashed var(--line); font-size:15px; line-height:1.5; }

.phr { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }

.feat { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }

a.mapbtn { display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:8px 14px; border-radius:99px; border:1.5px solid var(--acc); color:var(--acc); text-decoration:none; font-size:14px; font-weight:700; }
a.mapbtn svg { width:16px; height:16px; stroke:currentColor; }
.bmap { width:100%; max-width:640px; height:auto; display:block; margin:8px auto 0; border-radius:14px; }
.bmap .sea{fill:#DCEEFB}.bmap .land{fill:#F4F1E4;stroke:#C9C2A6}.bmap .lb{font-size:13px;font-weight:700;fill:#1B2733;paint-order:stroke;stroke:#fff;stroke-width:3px}.bmap .ct{font-size:12px;fill:#8C8570}
.guide { background:var(--bg); border-radius:14px; padding:12px 14px; margin-top:10px; font-size:14.5px; line-height:1.6; }

@media (max-width:1100px) {

  .grid3 { grid-template-columns:repeat(2,minmax(0,1fr)); }
  .mapwrap, .fx { grid-template-columns:1fr; }
}
@media (max-width:700px) {
  body { padding:12px 16px 32px; }
  .logo { display:none; }
  .dday { font-size:15px; padding:3px 10px; }
  .two { flex-direction:column; align-items:stretch; }
  .left { width:auto; }
  .days { flex-direction:row; overflow-x:auto; padding-bottom:4px; }
  .day { flex-direction:column; align-items:center; min-width:64px; width:auto; padding:8px 6px; gap:2px; }
  .day .info, .day .tag { display:none; }
  .grid2, .grid3 { grid-template-columns:1fr; }
  .glance { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .thero { padding:20px; } .thero .n { font-size:48px; }
  .hero { flex-direction:column; align-items:flex-start; } .hero .t { font-size:28px; }
  .geo { grid-template-columns:1fr; justify-items:center; } .gaddr { grid-template-columns:1fr; }
  .fleg .ap { font-size:28px; } .fleg .tm { font-size:19px; }
}
</style>

// ───────── 공통 유틸 ─────────
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const O = t => '<span class="o">' + t + '</span>';          // 신뢰된 상수용
const Oe = t => t ? O(esc(t)) : '';                          // 여행 데이터용
const WD = ['일','월','화','수','목','금','토'];
const dObj = s => { const [y,m,d] = s.split('-').map(Number); return new Date(Date.UTC(y, m-1, d)); };
const md = s => { const d = dObj(s); return (d.getUTCMonth()+1) + '월 ' + d.getUTCDate() + '일'; };
const wd = s => WD[dObj(s).getUTCDay()];

// ───────── 여행 날짜 로직 ─────────
function dayList() { return Object.keys(S.trip.days || {}).sort(); }
function tzOf(d) { const x = (S.trip.days || {})[d]; return x && typeof x.tz === 'number' ? x.tz : 9; }
function phase() {
  const ds = dayList();
  for (const d of ds) if (localDate(tzOf(d)) === d) return { p:'during', today:d };
  const first = ds[0] || S.trip.start, last = ds[ds.length-1] || S.trip.end;
  if (localDate(tzOf(first)) < first) return { p:'before', today:null, left:diffDays(localDate(9), first) };
  if (localDate(tzOf(last)) > last) return { p:'after', today:null };
  // 여행 기간 중 일정이 없는 날: 가장 가까운 지난 날짜를 오늘로
  const now = localDate(9); const past = ds.filter(d => d <= now);
  return { p:'during', today: past[past.length-1] || first };
}
// 쓰기 가능 여부: 보기 모드(부모)는 불가, 여행 전엔 불가, 여행 중엔 오늘까지, 여행 후엔 전부
function canWrite(d) {
  if (S.readOnly) return false;
  if (S.trip.diaryOpen) return true;          // 부모가 가져오기 JSON에서 켜면 미리 써 보기 가능
  const ph = phase();
  if (ph.p === 'before') return false;
  if (ph.p === 'after') return true;
  return d <= ph.today;
}

// ───────── 일기 저장: 기기 먼저 → Firebase ─────────
const draftKey = path => 'tripDraft:' + S.tuid + ':' + S.tid + ':' + path;
function getDraft(path) { try { return JSON.parse(localStorage.getItem(draftKey(path)) || 'null'); } catch (e) { return null; } }
function entry(path) {                       // 서버값 위에 전송 대기 중인 기기 저장본을 덮어서 보여줌
  const dr = getDraft(path);
  if (dr && dr.pending) return dr.data;
  const [a, b] = path.split('/');
  return a === 'meta' ? (S.diary.meta || null) : ((S.diary.days || {})[b] || null);
}
function push(path, data, onDone) {
  return db.ref('tripDiary/' + S.tuid + '/' + S.tid + '/' + path).set(data).then(() => {
    const dr = getDraft(path);
    if (dr && dr.data.updatedAt === data.updatedAt) localStorage.removeItem(draftKey(path));
    onDone && onDone(true);
  }).catch(e => { onDone && onDone(false, e); });
}
// statusId: 상태 글자를 쓸 요소 id — 저장 후 화면이 다시 그려져도 새 요소를 찾아 갱신
function saveEntry(path, data, statusId) {
  data.updatedAt = Date.now();
  try { localStorage.setItem(draftKey(path), JSON.stringify({ data, pending:true })); } catch (e) {}
  S.dirty = false;
  const say = t => { const el = statusId && $(statusId); if (el) el.textContent = t; };
  say(S.online ? '기기에 저장됨 · 보내는 중…' : '기기에 저장됨 · 인터넷 연결되면 자동으로 보내요');
  push(path, data, (ok, e) => say(ok ? '저장됨 · ' + hhmm(data.updatedAt) : '기기에만 저장됨 (' + (e && e.code || '오류') + ') · 다시 열면 또 보내요'));
}
function flushDrafts() {
  const pre = 'tripDraft:' + S.tuid + ':' + S.tid + ':';
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (!k || !k.startsWith(pre)) continue;
    const dr = getDraft(k.slice(pre.length));
    if (dr && dr.pending) push(k.slice(pre.length), dr.data);
  }
}

function bindEditor(d) {

  document.querySelectorAll('.mood').forEach(b => b.onclick = () => { dirty(); cur.mood = b.dataset.m; document.querySelectorAll('.mood').forEach(x => x.classList.toggle('on', x === b)); });

}

const pad = n => String(n).padStart(2, '0');
function flightCalc(f) {
  const A = AIRPORT[f.from] || { tz:9 }, B = AIRPORT[f.to] || { tz:9 };
  const t = (d, hm, tz) => { const [h, m] = hm.split(':').map(Number); return dObj(d).getTime() + (h * 60 + m) * 6e4 - tz * 36e5; };
  const dep = t(f.date, f.dep, A.tz);
  let arr = t(f.date, f.arr, B.tz), plus = 0;
  while (arr <= dep) { arr += 864e5; plus++; }
  const mins = Math.round((arr - dep) / 6e4);
  const [dh, dm] = f.dep.split(':').map(Number), [ah, am] = f.arr.split(':').map(Number);
  const clock = ((ah * 60 + am) - (dh * 60 + dm) + plus * 1440);
  return { dep, arr, plus, mins, clock, diff:B.tz - A.tz };
}

  let note;

    ' — ' + B.city + josa(B.city, '이', '가') + ' ' + A.city + '보다 <b>' + Math.abs(c.diff) + '시간 ' + (c.diff > 0 ? '빠르기' : '늦기') + '</b> 때문이에요' + (c.diff > 0 ? ' (시계를 ' + c.diff + '시간 앞으로!)' : ' (시계를 ' + (-c.diff) + '시간 뒤로!)');

    for (const k of ['from','to']) if (!/^[A-Z]{3}$/.test(x[k] || '')) err.push(P + '.' + k + ': 공항 코드 3글자');
    for (const k of ['from','to']) if (x[k] && !AIRPORT[x[k]]) warn.push(P + '.' + k + ': ' + x[k] + ' — 공항 정보가 없어 한국 시간으로 계산');
    for (const k of ['fromT','toT']) if (x[k] != null && !/^T?\d{1,2}$|^[A-Z]$/.test(x[k])) err.push(P + '.' + k + ': 터미널 (예: T1)');
    for (const k of ['dep','arr']) if (!isHM(x[k])) err.push(P + '.' + k + ': 시각 HH:MM');
    return x;
  });
  const days = {};
  for (const [d, v] of Object.entries(t.days || {})) {
    if (!isDate(d) || d < t.start || d > t.end) { err.push('days.' + d + ': 여행 기간 밖이거나 날짜 형식이 아님'); continue; }
    const x = pick(v, ALLOW.day, 'days.' + d);
    if (!x.title) err.push('days.' + d + '.title: 필요');
    for (const k of ['title','short','place','desc','tip']) { if (x[k] != null && typeof x[k] !== 'string') err.push('days.' + d + '.' + k + ': 글자여야 함'); chk(x[k], 'days.' + d + '.' + k); }
    x.tips = (Array.isArray(x.tips) ? x.tips : []).filter(v => typeof v === 'string').map((v, i) => (chk(v, 'days.' + d + '.tips[' + i + ']'), v));
    x.plan = (Array.isArray(x.plan) ? x.plan : []).map((r, i) => {
      if (!Array.isArray(r) || typeof r[0] !== 'string' || typeof r[1] !== 'string') { err.push('days.' + d + '.plan[' + i + ']: ["시각", "할 일"]'); return ['', '']; }
      chk(r[1], 'days.' + d + '.plan[' + i + ']'); if (r[0].length > 12) err.push('days.' + d + '.plan[' + i + ']: 시각 칸이 너무 길어요');
      return [r[0], r[1]];
    });
    if (x.tz != null && (typeof x.tz !== 'number' || x.tz < -12 || x.tz > 14)) err.push('days.' + d + '.tz: -12~14 숫자');
    x.spots = (Array.isArray(x.spots) ? x.spots : []).filter(s => { if (!SPOT[s]) { warn.push('days.' + d + '.spots: ' + s + ' — 라이브러리에 없어 버림'); return false; } return true; });
    delete x.chips;
    days[d] = x;
  }
  if (!Object.keys(days).length) err.push('days: 하루 이상 필요');
  t.days = days;
  t.stays = (Array.isArray(t.stays) ? t.stays : []).map((s, i) => {
    const x = pick(s, ALLOW.stay, 'stays[' + i + ']');
    for (const k of ['name','local','area','address','desc','checkin','checkout']) chk(x[k], 'stays[' + i + '].' + k);
    x.features = (Array.isArray(x.features) ? x.features : []).filter(v => typeof v === 'string').map((v, j) => (chk(v, 'stays[' + i + '].features[' + j + ']'), v));
    if (x.map != null && !/^https:\/\/(www\.)?google\.[a-z.]+\/maps\//.test(x.map)) err.push('stays[' + i + '].map: 구글 지도 주소(https://www.google.com/maps/...)만 허용');
    for (const k of ['lat','lon']) if (x[k] != null && typeof x[k] !== 'number') err.push('stays[' + i + '].' + k + ': 숫자');
    for (const k of ['from','to']) if (x[k] != null && !isDate(x[k])) err.push('stays[' + i + '].' + k + ': 날짜 형식');
    if (!x.name) err.push('stays[' + i + '].name: 필요');
    return x;
  });
  const fx = {};
  for (const [c, v] of Object.entries(t.fx || {})) {
    if (!COUNTRY[c]) { warn.push('fx.' + c + ' — 버림'); continue; }
    const x = pick(v, ALLOW.fx, 'fx.' + c);
    if (typeof x.now !== 'number' || typeof x.price !== 'number') err.push('fx.' + c + ': now·price는 숫자');
    if (!x.date) err.push('fx.' + c + '.date: 기준 날짜 필요');
    for (const k of ['unit','date','item']) chk(x[k], 'fx.' + c + '.' + k);
    x.hist = (Array.isArray(x.hist) ? x.hist : []).map((h, i) => { chk(h[0], 'fx.' + c + '.hist[' + i + ']'); return [String(h[0]), typeof h[1] === 'number' ? h[1] : null]; });
    fx[c] = x;
  }
  t.fx = fx;
  return { err, warn, clean:t };
}
function bindImport() {
  let ready = null;
  const show = (html) => $('impMsg').innerHTML = html;
  $('impTa').oninput = () => { ready = null; $('impGo').disabled = true; };
  $('impCheck').onclick = () => {
    let o; try { o = JSON.parse($('impTa').value); } catch (e) { show('<div class="err">JSON 형식 오류: ' + esc(e.message) + '</div>'); return; }
    const r = validateTrip(o);
    const w = r.warn.length ? '<div class="muted small">' + r.warn.map(esc).join('<br>') + '</div>' : '';
    if (r.err.length) { show('<div class="err"><b>가져올 수 없어요 — 고칠 곳 ' + r.err.length + '개</b><br>' + r.err.map(esc).join('<br>') + '</div>' + w); return; }
    ready = r.clean; $('impGo').disabled = false;
    show('<div class="okmsg">통과: ' + esc(ready.title) + ' · ' + Object.keys(ready.days).length + '일 · 비행기 ' + ready.flights.length + '편 · 숙소 ' + ready.stays.length + '곳' + (ready.diaryOpen ? ' · 일기 미리 쓰기 열림' : '') + '</div>' + w);
  };
  $('impGo').onclick = async () => {
    if (!ready) return; $('impGo').disabled = true;
    try {
      const uids = {}; uids[S.me] = true;
      for (const m of ready.members) {
        const u = (await db.ref('usernames/' + m).once('value')).val();
        if (!u) throw new Error('아이디를 찾을 수 없어요: ' + m);
        uids[u] = true;
      }
      const data = Object.assign({}, ready); delete data.members;
      data.memberUids = uids; data.updatedAt = firebase.database.ServerValue.TIMESTAMP; data.updatedBy = S.me;
      await db.ref('trips/' + ready.id).set(data);
      for (const u of Object.keys(uids)) await db.ref('userTrips/' + u + '/' + ready.id).set({ title:ready.title, start:ready.start, end:ready.end });
      show('<div class="okmsg">등록했어요. <a href="trip.html?id=' + encodeURIComponent(ready.id) + '">열어 보기</a></div>');
    } catch (e) { show('<div class="err">저장 실패: ' + esc(e.message || e.code) + '</div>'); $('impGo').disabled = false; }
  };
}

// ───────── 시작 ─────────
$('backBtn').onclick = () => { if (S.tid) location.href = 'trip.html'; else location.href = 'index.html'; };
if (!localStorage.getItem('currentUser')) location.href = 'login.html';
auth.onAuthStateChanged(async user => {
  if (!user) { location.href = 'login.html'; return; }
  S.me = S.tuid = user.uid;
  try { S.role = ((await db.ref('users/' + user.uid + '/role').once('value')).val()) || 'child'; } catch (e) { S.role = 'child'; }
  try {
    const vc = JSON.parse(localStorage.getItem('viewChild') || 'null');
    if (vc && vc.uid) {
      S.tuid = vc.uid; S.readOnly = true;
      $('vc').innerHTML = '<div class="vcbar"><span style="flex:1">' + esc(vc.name) + ' 보기 모드 (부모) — 일기는 읽기만 돼요</span><button id="vcOff">내 계정으로</button></div>';
      $('vcOff').onclick = () => { localStorage.removeItem('viewChild'); location.reload(); };
    }
  } catch (e) {}
  S.tid = new URLSearchParams(location.search).get('id');
  if (!S.tid) { renderList(); return; }
  try { S.trip = (await db.ref('trips/' + S.tid).once('value')).val(); } catch (e) { S.trip = null; }
  if (!S.trip || !S.trip.days) { S.tid = null; renderList('여행을 찾을 수 없거나 볼 수 없어요'); return; }
  $('title').textContent = S.trip.title || '여행';
  document.title = (S.trip.title || '여행') + ' · Halo Kids';
  const h = location.hash.slice(1);
  S.tab = TABS.some(t => t[0] === h) ? h : ({ during:'days', after:'diary' }[phase().p] || 'home');
  render();
  db.ref('tripDiary/' + S.tuid + '/' + S.tid).on('value', snap => {
    const v = snap.val() || {}; S.diary = { days:v.days || {}, meta:v.meta || {} };
    // 쓰는 중인 일기는 다시 그리지 않음 (쓰던 글 보호). 첫 로드는 항상 그림
    if (S.dirty) return;
    render();
  }, () => {});
  db.ref('.info/connected').on('value', s => { S.online = !!s.val(); if (S.online) flushDrafts(); });
});
