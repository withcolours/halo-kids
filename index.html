<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Halo Kids</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Halo Kids">
<link rel="apple-touch-icon" href="icon-home.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F8FD">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<script src="https://unpkg.com/feather-icons"></script>
<style>
:root { --bg:#F2F8FD; --card:#FFFFFF; --ink:#22303C; --sub:#64748B; --line:#D8E6F2; --acc:#1E90FF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; } }
:root[data-theme="dark"] { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; margin:0; padding:20px; display:flex; flex-direction:column; align-items:center; }
.header { position:relative; width:100%; max-width:560px; margin-bottom:8px; display:flex; align-items:center; }
h1 { font-family:'Jua',sans-serif; font-weight:400; font-size:clamp(30px,6vw,44px); margin:16px 0 6px; flex:1; }
.sub { color:var(--sub); font-size:15px; margin-bottom:20px; }
.hbtn { width:40px; height:40px; background:var(--card); border:1.5px solid var(--line); border-radius:99px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); transition:transform .12s; flex:0 0 40px; margin-left:8px; }
.hbtn.avatar { background:var(--acc); border-color:var(--acc); color:#fff; font-family:'Jua',sans-serif; font-size:18px; }
.hbtn:active { transform:scale(.95); }
.menu { display:grid; gap:16px; width:100%; max-width:560px; }
a.card { display:flex; align-items:center; gap:16px; background:var(--card); border:2px solid var(--line); border-radius:18px; padding:24px 22px; text-decoration:none; color:var(--ink); transition:transform .12s; }
a.card:active { transform:scale(.98); }
.icon { width:44px; height:44px; display:flex; align-items:center; justify-content:center; }
.icon svg { width:36px; height:36px; color:var(--acc); stroke-width:2; }
.t { font-family:'Jua',sans-serif; font-size:24px; margin:0; }
.d { color:var(--sub); font-size:13.5px; margin-top:3px; }
.tag { margin-left:auto; font-size:12px; font-weight:700; color:#fff; border-radius:99px; padding:4px 10px; white-space:nowrap; }
/* 우상단 드롭다운 */
.dropdown { position:absolute; top:64px; right:0; background:var(--card); border:1.5px solid var(--line); border-radius:16px; box-shadow:0 8px 24px rgba(16,42,67,.14); min-width:190px; overflow:hidden; display:none; z-index:20; }
.dropdown.open { display:block; }
.dd-item { display:flex; align-items:center; gap:10px; padding:13px 16px; font-size:14px; font-weight:500; color:var(--ink); text-decoration:none; cursor:pointer; border:none; background:none; width:100%; font-family:inherit; text-align:left; }
.dd-item:active { background:var(--line); }
.dd-item svg { width:17px; height:17px; color:var(--sub); stroke-width:2; }
.dd-sep { border-top:1px solid var(--line); }
.dd-item.danger { color:#D6453D; }
.dd-item.danger svg { color:#D6453D; }
</style>
</head>
<body>
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<div class="header">
  <h1>Halo <span style="color:var(--acc);">Kids!</span></h1>
  <button class="hbtn avatar" onclick="toggleMenu(event)" title="내 계정" id="menuBtn">?</button>
  <script>(function(){var n=localStorage.getItem('nickname')||localStorage.getItem('username');if(n)document.getElementById('menuBtn').textContent=n[0].toUpperCase();})();</script>

  <div class="dropdown" id="dropdown">
    <div style="padding:13px 16px; border-bottom:1px solid var(--line);">
      <div style="font-weight:700; font-size:14px;" id="ddName">-</div>
      <div style="font-size:12px; color:var(--sub);" id="ddUsername">-</div>
    </div>
    <a class="dd-item" href="profile.html"><svg data-feather="user"></svg>프로필</a>
    <button class="dd-item" onclick="event.stopPropagation(); toggleTheme()"><svg data-feather="moon" id="ddThemeIcon"></svg><span id="ddThemeLabel">어두운 테마로</span></button>
    <a class="dd-item" href="settings.html"><svg data-feather="settings"></svg>설정</a>
    <a class="dd-item" href="admin.html" id="adminItem" style="display:none"><svg data-feather="shield"></svg>관리</a>
    <button class="dd-item danger dd-sep" onclick="handleLogout()"><svg data-feather="log-out"></svg>로그아웃</button>
  </div>
</div>

<p class="sub">오늘은 뭘 읽을까, 뭘 볼까? 골라 보세요!</p>

<div class="menu">
  <a class="card" href="category.html?type=books">
    <div class="icon"><svg data-feather="book" width="36" height="36"></svg></div>
    <span><span class="t">책</span><br><span class="d">앗! 시리즈 등 전집 고르기</span></span>
    <span class="tag" style="background:#1E90FF">책</span>
  </a>

  <a class="card" href="category.html?type=ott">
    <div class="icon"><svg data-feather="play-circle" width="36" height="36"></svg></div>
    <span><span class="t">영상</span><br><span class="d">영어 애니메이션 추천</span></span>
    <span class="tag" style="background:#3B6FE0">영상</span>
  </a>
</div>

<script>
// 페이지 로드 시 로그인 상태 검증
window.addEventListener('DOMContentLoaded', () => {
  if (!localStorage.getItem('currentUser')) {
    window.location.href = 'login.html';
    return;
  }
  if (window.feather) feather.replace();
  updateThemeIcon();
});

// 우상단 메뉴 드롭다운
function toggleMenu(e) {
  e.stopPropagation();
  document.getElementById('dropdown').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const dd = document.getElementById('dropdown');
  if (dd.classList.contains('open') && !dd.contains(e.target)) {
    dd.classList.remove('open');
  }
});

// 테마 토글
function toggleTheme() {
  const html = document.documentElement;
  const attr = html.getAttribute('data-theme');
  const isDark = attr ? attr === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const next = isDark ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeIcon();
}

// 테마 메뉴 항목 라벨/아이콘 갱신
function updateThemeIcon() {
  const attr = document.documentElement.getAttribute('data-theme');
  const isDark = attr ? attr === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  const label = document.getElementById('ddThemeLabel');
  const icon = document.getElementById('ddThemeIcon');
  if (label) label.textContent = isDark ? '밝은 테마로' : '어두운 테마로';
  if (icon) {
    icon.setAttribute('data-feather', isDark ? 'sun' : 'moon');
    if (window.feather) feather.replace();
  }
}
</script>

<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAy889tWquig05QYOEphozzlaTbfiPIbyc",
  authDomain: "halo-kids.firebaseapp.com",
  databaseURL: "https://halo-kids-default-rtdb.firebaseio.com",
  projectId: "halo-kids",
  storageBucket: "halo-kids.firebasestorage.app",
  messagingSenderId: "148528901393",
  appId: "1:148528901393:web:32256a8df7bff9417b30b0"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// 아바타 글자 + 계정 정보 + 관리자 메뉴
firebase.auth().onAuthStateChanged(async (fbUser) => {
  if (!fbUser) { localStorage.removeItem('currentUser'); localStorage.removeItem('username'); localStorage.removeItem('nickname'); window.location.href = 'login.html'; return; }
  const uid = fbUser.uid;
  const username = localStorage.getItem('username') || '';
  // 첫 페인트는 위 인라인 스크립트가 캐시(nickname)로 이미 그렸으므로,
  // 여기서는 캐시가 전혀 없던 경우에만 아이디 첫 글자로 보정한다 (깜빡임 방지)
  if (!localStorage.getItem('nickname') && username) {
    document.getElementById('menuBtn').textContent = username[0].toUpperCase();
  }
  document.getElementById('ddUsername').textContent = username;

  const me = (await db.ref(`users/${uid}`).once('value')).val();
  if (me) {
    const name = me.nickname || username;
    document.getElementById('ddName').textContent = name;
    document.getElementById('menuBtn').textContent = name[0].toUpperCase();
    localStorage.setItem('nickname', name);
    if (me.role === 'admin') {
      document.getElementById('adminItem').style.display = '';
      if (window.feather) feather.replace();
    }
  }
});

// 로그아웃 (활동 로그 남기고 종료)
async function handleLogout() {
  const userId = localStorage.getItem('currentUser');
  try {
    if (userId) {
      await db.ref(`userActivity/${userId}`).push({
        action: 'logout',
        timestamp: firebase.database.ServerValue.TIMESTAMP
      });
    }
    await auth.signOut();
  } catch (e) { /* 오류여도 로컬 세션은 정리 */ }
  localStorage.removeItem('currentUser');
  localStorage.removeItem('username'); localStorage.removeItem('nickname');
  window.location.href = 'login.html';
}
</script>
</body>
</html>
