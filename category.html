<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카테고리 선택</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-home.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F8FD">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<script src="https://unpkg.com/feather-icons"></script>
<style>
:root { --bg:#F2F8FD; --card:#FFFFFF; --ink:#22303C; --sub:#64748B; --line:#D8E6F2; --acc:#1E90FF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; } }
:root[data-theme="dark"] { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; margin:0; padding:20px; display:flex; flex-direction:column; align-items:center; }
.header { width:100%; max-width:560px; margin-bottom:24px; display:flex; align-items:center; gap:12px; }
.back-btn { width:40px; height:40px; border:1.5px solid var(--line); background:var(--card); border-radius:99px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); transition:transform .12s; }
.back-btn:active { transform:scale(.95); }
.back-btn svg { width:20px; height:20px; stroke-width:2; }
h1 { font-family:'Jua',sans-serif; font-weight:400; font-size:clamp(24px,5vw,36px); margin:0; flex:1; }
.menu { display:grid; gap:16px; width:100%; max-width:560px; }
a.card { display:flex; align-items:center; gap:16px; background:var(--card); border:2px solid var(--line); border-radius:18px; padding:18px 20px; text-decoration:none; color:var(--ink); transition:transform .12s; }
a.card:active { transform:scale(.98); }
.icon { width:40px; height:40px; display:flex; align-items:center; justify-content:center; }
.icon svg { width:32px; height:32px; color:var(--acc); stroke-width:2; }
.t { font-family:'Jua',sans-serif; font-size:20px; margin:0; }
.d { color:var(--sub); font-size:13px; margin-top:2px; }
.tag { margin-left:auto; font-size:12px; font-weight:700; color:#fff; border-radius:99px; padding:4px 10px; white-space:nowrap; }
</style>
</head>
<body>
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<div class="header">
  <button class="back-btn" onclick="goBack()" title="돌아가기">
    <svg data-feather="chevron-left"></svg>
  </button>
  <h1 id="title"></h1>
  <a href="index.html" class="back-btn" title="처음으로" style="text-decoration:none; flex:0 0 40px;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
</div>

<div class="menu" id="menu"></div>

<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
<script>
// Firebase 설정
const firebaseConfig = {
  apiKey: "AIzaSyAy889tWquig05QYOEphozzlaTbfiPIbyc",
  authDomain: "halo-kids.firebaseapp.com",
  databaseURL: "https://halo-kids-default-rtdb.firebaseio.com",
  projectId: "halo-kids",
  storageBucket: "halo-kids.firebasestorage.app",
  messagingSenderId: "148528901393",
  appId: "1:148528901393:web:32256a8df7bff9417b30b0"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

window.addEventListener('load', () => {
  // 로그인 상태 확인
  if (!localStorage.getItem('currentUser')) {
    window.location.href = 'login.html';
    return;
  }

  // 테마 복원
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  // URL 파라미터에서 type 읽기
  const params = new URLSearchParams(window.location.search);
  const type = params.get('type');

  if (type === 'books') {
    renderBooks();
  } else if (type === 'ott') {
    renderOTT();
  } else {
    window.location.href = 'index.html';
  }

  feather.replace();
});

function renderBooks() {
  document.getElementById('title').textContent = '책 고르기';

  const html = `
    <a class="card" href="at-series.html">

    </a>
    <a class="card" href="discussking.html">

      <span class="tag" style="background:#8B5CD6">93권</span>
    </a>
    <a class="card" href="math-basic.html">

      <span><span class="t">수학 뒤집기 기본편</span><br><span class="d">초등 수학 학습만화 40권</span></span>
      <span class="tag" style="background:#3B6FE0">40권</span>
    </a>
    <a class="card" href="math-adv.html">
      <div class="icon"><svg data-feather="trending-up" width="32" height="32"></svg></div>
      <span><span class="t">수학 뒤집기 심화편</span><br><span class="d">본책 40권 + 문제집 10권</span></span>
      <span class="tag" style="background:#0FA3A8">50권</span>
    </a>
    <a class="card" href="science-basic.html">

  `;

  document.getElementById('menu').innerHTML = html;
  feather.replace();

function renderOTT() {
  document.getElementById('title').textContent = '영상 고르기';

  const html = `
    <a class="card" href="videos.html">
      <div class="icon"><svg data-feather="film" width="32" height="32"></svg></div>

      <span class="tag" style="background:#3B6FE0">181편</span>
    </a>
  `;

  document.getElementById('menu').innerHTML = html;
  feather.replace();
}

function goBack() {
  history.back();
}
</script>
</body>
</html>
