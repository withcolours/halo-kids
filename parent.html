<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>부모 홈</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-home.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F8FD">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root { --bg:#F2F8FD; --card:#FFFFFF; --ink:#22303C; --sub:#64748B; --line:#D8E6F2; --acc:#1E90FF; --ok:#2E9E5B; --gold:#C99A16; --warn:#E0742C; --bad:#D6453D; --flame:#FF9A3D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; } }
:root[data-theme="dark"] { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; margin:0; padding:18px 16px 60px; display:flex; flex-direction:column; align-items:center; }
.header { width:100%; max-width:560px; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
.hbtn { width:40px; height:40px; border:1.5px solid var(--line); background:var(--card); border-radius:99px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); flex:0 0 40px; text-decoration:none; }
.hbtn:active { transform:scale(.95); }
h1 { font-family:'Jua',sans-serif; font-weight:400; font-size:26px; margin:0; flex:1; }
.svgi { width:20px; height:20px; }
main { width:100%; max-width:560px; }
.sect { font-size:12.5px; font-weight:700; color:var(--sub); margin:20px 0 8px; display:flex; align-items:center; gap:8px; }
.sect:first-child { margin-top:4px; }
.childcard { background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:16px; margin-bottom:12px; }
.chead { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.avatar { width:46px; height:46px; flex:0 0 46px; border-radius:99px; background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Jua',sans-serif; font-size:22px; }
.cname { flex:1; min-width:0; }
.cname b { font-size:16px; font-weight:700; display:block; }
.cname span { font-size:12px; color:var(--sub); }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
.stat { background:var(--bg); border:1.5px solid var(--line); border-radius:14px; padding:10px 6px; text-align:center; }
.stat .v { font-family:'Jua',sans-serif; font-size:18px; font-weight:400; }
.stat .v.gold { color:var(--gold); }
.stat .v.flame { color:var(--flame); }
.stat .v.acc { color:var(--acc); }
.stat .v.ok { color:var(--ok); }
.stat .l { font-size:10.5px; color:var(--sub); font-weight:700; margin-top:3px; }
.planbtn { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; border:1.5px solid var(--acc); background:transparent; color:var(--acc); border-radius:12px; padding:10px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; text-decoration:none; }
.planbtn:active { transform:scale(.985); }
.item { display:flex; align-items:center; gap:12px; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:13px 14px; margin-bottom:8px; }
.item .tx { flex:1; min-width:0; }
.item .tt { font-size:14.5px; font-weight:700; }
.item .st { font-size:12px; color:var(--gold); font-weight:700; margin-top:1px; }
.mini { border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:99px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; font-family:inherit; }
.mini.ok { border-color:var(--ok); color:var(--ok); }
.mini.no { border-color:var(--bad); color:var(--bad); }
.mini:disabled { opacity:.5; cursor:default; }
.empty2 { font-size:13px; color:var(--sub); text-align:center; padding:18px 0; }
.notice { background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:30px 18px; text-align:center; }
.notice b { font-family:'Jua',sans-serif; font-weight:400; font-size:17px; display:block; margin-bottom:6px; }
.notice p { font-size:13px; color:var(--sub); margin:0 0 16px; }
.notice a { display:inline-block; background:var(--acc); color:#fff; border-radius:99px; padding:10px 20px; font-size:13.5px; font-weight:700; text-decoration:none; }
.skel { color:var(--sub); font-size:13px; text-align:center; padding:30px 0; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#1f2937; color:#fff; border-radius:12px; padding:11px 16px; font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:99; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>

<div class="header">
  <button class="hbtn" onclick="history.back()" aria-label="뒤로"><svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
  <h1>부모 홈</h1>
  <a href="index.html" class="hbtn" title="처음으로"><svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
</div>

<main>
  <div id="content"><div class="skel">불러오는 중…</div></div>
</main>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAy889tWquig05QYOEphozzlaTbfiPIbyc",
  authDomain: "halo-kids.firebaseapp.com",
  databaseURL: "https://halo-kids-default-rtdb.firebaseio.com",
  projectId: "halo-kids",
  storageBucket: "halo-kids.firebasestorage.app",
  messagingSenderId: "148528901393",
  appId: "1:148528901393:web:32256a8df7bff9417b30b0"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY = () => ymd(new Date());
function addDays(dstr,n){ const d=new Date(dstr+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); }
function kindOf(t){ return t && t.kind==='routine' ? 'routine' : 'todo'; }
function mondayOf(d){ const x=new Date(d), day=x.getDay(); x.setDate(x.getDate()+(day===0?-6:1-day)); x.setHours(0,0,0,0); return x; }
function dow(dstr){ const d=new Date(dstr+'T00:00:00'); return d.getDay()===0?6:d.getDay()-1; } // 월=0…일=6
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c)); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2600); }
function permMsg(e){ const m=(e&&(e.code||e.message))||String(e); return /permission/i.test(m)?'보안 규칙 게시가 필요해요 — 게시 후 새로고침해 주세요.':'불러오지 못했어요: '+m; }

/* ── 게임 경제 공통 계산 (오늘·상점 동일 로직) ── */
const PROT_MAX=2, CARRY_MAX=5;
function lastWedOf(y,m){ const d=new Date(y,m+1,0); while(d.getDay()!==3)d.setDate(d.getDate()-1); return ymd(d); }
function isFamilyDay(ds){ const d=new Date(ds+'T00:00:00'); return ds===lastWedOf(d.getFullYear(),d.getMonth()); }
function computeGame(weeks,checks,reds){
  const wsOf=d=>ymd(mondayOf(new Date(d+'T00:00:00')));
  const dayInfo={};
  for(const [ws,w] of Object.entries(weeks||{})){
    const tasks=w.tasks||[];
    for(let i=0;i<7;i++){
      const date=addDays(ws,i);
      if(date>TODAY())continue;
      const tds=tasks.filter(t=>(t.days||[]).includes(i)&&kindOf(t)==='todo');
      if(!tds.length)continue;
      const dc=checks[date]||{};
      dayInfo[date]={total:tds.length,done:tds.filter(t=>dc[t.id]).length};
    }
  }
  const dayStars={}, weekFull={};
  for(const [d,x] of Object.entries(dayInfo)){
    if(x.done===x.total){ dayStars[d]=2; const ws=wsOf(d); weekFull[ws]=(weekFull[ws]||0)+1; }
    else if(x.done*2>=x.total){ dayStars[d]=1; }
  }
  // 스트릭: 체크 1개 이상 = 유지. 가정의 날 자동 보호, 보호권(14일마다 +1, 최대 2)은 빠진 날 소모
  const activeDates=Object.keys(checks||{}).filter(d=>Object.keys(checks[d]||{}).length&&d<=TODAY()).sort();
  let run=0, prot=0; const milestoneStars={};
  if(activeDates.length){
    let d=activeDates[0]; const today=TODAY();
    while(d<=today){
      const active=checks[d]&&Object.keys(checks[d]).length>0;
      if(active){
        run++;
        if(run===7) milestoneStars[d]=(milestoneStars[d]||0)+3;
        if(run===30) milestoneStars[d]=(milestoneStars[d]||0)+10;
        if(run>0&&run%14===0) prot=Math.min(PROT_MAX,prot+1);
      }else if(d===today){ break; }          // 오늘 미체크는 아직 리셋 아님
      else if(isFamilyDay(d)){ /* 가정의 날 — 자동 보호 */ }
      else if(prot>0){ prot--; }             // 보호권 소모
      else { run=0; }
      d=addDays(d,1);
    }
  }
  // 주별 적립/지출 → 일요일 정산 (이월 최대 CARRY_MAX)
  const weekEarn={};
  const add=(d,s)=>{ const ws=wsOf(d); weekEarn[ws]=(weekEarn[ws]||0)+s; };
  for(const [d,s] of Object.entries(dayStars)) add(d,s);
  for(const [d,s] of Object.entries(milestoneStars)) add(d,s);
  for(const [ws,n] of Object.entries(weekFull)) if(n>=5) weekEarn[ws]=(weekEarn[ws]||0)+5;
  const weekSpend={};
  for(const r of Object.values(reds||{})){
    if(r.status!=='approved')continue;
    const ws=wsOf(ymd(new Date(r.decidedAt||r.reqAt||Date.now())));
    weekSpend[ws]=(weekSpend[ws]||0)+(r.star||0);
  }
  const curWs=wsOf(TODAY());
  const allWs=[...new Set([...Object.keys(weekEarn),...Object.keys(weekSpend)])].sort();
  let bal=0, earned=0, spent=0, expired=0;
  for(const ws of allWs){
    if(ws>curWs)continue;
    bal+=weekEarn[ws]||0; earned+=weekEarn[ws]||0;
    bal-=weekSpend[ws]||0; spent+=weekSpend[ws]||0;
    if(bal<0)bal=0;
    if(ws<curWs){ const c=Math.min(bal,CARRY_MAX); expired+=bal-c; bal=c; }
  }
  const next=run>=30?100:(run>=7?30:7);
  return {balance:bal,earned,spent,expired,streak:run,prot,next,toNext:Math.max(0,next-run)};
}

let uid=null;
let children={};   // {childUid: {profile, weeks, checks, reds, game, today:{done,total}, week:{done,total}}}

function calcSnapshot(weeks,checks){
  const curWs=ymd(mondayOf(new Date(TODAY()+'T00:00:00')));
  const tasks=((weeks||{})[curWs]||{}).tasks||[];
  const di=dow(TODAY());
  const todayTodos=tasks.filter(t=>(t.days||[]).includes(di)&&kindOf(t)==='todo');
  const todayChecks=(checks||{})[TODAY()]||{};
  const today={total:todayTodos.length,done:todayTodos.filter(t=>todayChecks[t.id]).length};
  let wTotal=0, wDone=0;
  for(let i=0;i<7;i++){
    const date=addDays(curWs,i);
    const tds=tasks.filter(t=>(t.days||[]).includes(i)&&kindOf(t)==='todo');
    const dc=(checks||{})[date]||{};
    wTotal+=tds.length;
    wDone+=tds.filter(t=>dc[t.id]).length;
  }
  return {today, week:{total:wTotal,done:wDone}};
}

async function loadChild(cuid){
  const [uS,wS,cS,rS]=await Promise.all([
    db.ref(`users/${cuid}`).once('value'),
    db.ref(`userPlanWeeks/${cuid}`).once('value'),
    db.ref(`userPlanChecks/${cuid}`).once('value'),
    db.ref(`redemptions/${cuid}`).once('value')
  ]);
  const weeks=wS.val()||{}, checks=cS.val()||{}, reds=rS.val()||{};
  const snap=calcSnapshot(weeks,checks);
  children[cuid]={
    profile:uS.val()||{},
    weeks, checks, reds,
    game:computeGame(weeks,checks,reds),
    today:snap.today, week:snap.week
  };
}

function svgCal(){ return '<svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="3" y1="9.5" x2="21" y2="9.5"/></svg>'; }

function render(){
  const cuids=Object.keys(children);
  let html='<div class="sect">아이들</div>';
  for(const cuid of cuids){
    const c=children[cuid], p=c.profile;
    const nick=p.nickname||p.username||cuid.slice(0,6);
    const wPct=c.week.total?Math.round(c.week.done/c.week.total*100):null;
    html+=`<div class="childcard">
      <div class="chead">
        <span class="avatar">${esc(String(nick).charAt(0))}</span>
        <span class="cname"><b>${esc(nick)}</b><span>${esc(p.username||'')}</span></span>
      </div>
      <div class="stats">
        <div class="stat"><div class="v acc">${c.today.total?c.today.done+'/'+c.today.total:'–'}</div><div class="l">오늘</div></div>
        <div class="stat"><div class="v ${wPct===100?'ok':'acc'}">${wPct===null?'–':wPct+'%'}</div><div class="l">이번 주</div></div>
        <div class="stat"><div class="v flame">🔥 ${c.game.streak}</div><div class="l">연속 일</div></div>
        <div class="stat"><div class="v gold">⭐ ${c.game.balance}</div><div class="l">별 잔고</div></div>
      </div>
      <a class="planbtn" href="planner-print.html?child=${encodeURIComponent(cuid)}">${svgCal()} 주간 계획 보기</a>
    </div>`;
  }
  // 승인 대기
  const rows=[];
  for(const cuid of cuids){
    const c=children[cuid];
    const nick=c.profile.nickname||c.profile.username||cuid.slice(0,6);
    for(const [id,r] of Object.entries(c.reds))
      if(r&&r.status==='requested') rows.push({cuid,id,r,nick});
  }
  rows.sort((a,b)=>(b.r.reqAt||0)-(a.r.reqAt||0));
  html+='<div class="sect">승인 대기</div>';
  html+=rows.length?rows.map(x=>
    `<div class="item"><span class="tx"><div class="tt">${esc(x.nick)} · ${esc(x.r.title||'')}</div><div class="st">⭐ ${x.r.star||0}</div></span>
    <button class="mini ok" data-ap="${esc(x.cuid)}/${esc(x.id)}">승인</button><button class="mini no" data-rj="${esc(x.cuid)}/${esc(x.id)}">거절</button></div>`
  ).join(''):'<div class="empty2">대기 중인 신청이 없어요.</div>';
  $('content').innerHTML=html;
}

document.addEventListener('click', async e=>{
  const ap=e.target.closest('[data-ap]'), rj=e.target.closest('[data-rj]');
  if(!ap&&!rj)return;
  const btn=ap||rj;
  const [cuid,id]=btn.dataset[ap?'ap':'rj'].split('/');
  const status=ap?'approved':'rejected';
  btn.disabled=true;
  try{
    await db.ref(`redemptions/${cuid}/${id}`).update({status,decidedAt:firebase.database.ServerValue.TIMESTAMP});
    toast(ap?'승인했어요.':'거절했어요.');
    await loadChild(cuid);   // 잔고·목록 갱신
    render();
  }catch(err){
    btn.disabled=false;
    const m=(err&&(err.code||err.message))||String(err);
    toast(/permission/i.test(m)?'처리 실패: 보안 규칙 게시가 필요해요.':'처리 실패: '+m);
  }
});

function showNotice(title,body,linkTxt,href){
  $('content').innerHTML=`<div class="notice"><b>${esc(title)}</b><p>${esc(body)}</p>${href?`<a href="${href}">${esc(linkTxt)}</a>`:''}</div>`;
}

if(!localStorage.getItem('currentUser')){
  window.location.href='login.html';
}else{
  auth.onAuthStateChanged(async user=>{
    if(!user){ window.location.href='login.html'; return; }
    uid=user.uid;
    try{
      const meS=await db.ref(`users/${uid}`).once('value');
      const me=meS.val()||{};
      if(me.role!=='parent'&&me.role!=='admin'){
        showNotice('부모 계정이 아니에요','이 페이지는 부모 계정에서만 볼 수 있어요. 프로필에서 계정을 확인해 주세요.','프로필로 가기','profile.html');
        return;
      }
      const kidsS=await db.ref(`parents/${uid}`).once('value');
      const kids=Object.keys(kidsS.val()||{});
      if(!kids.length){
        showNotice('아직 연결된 아이가 없어요','프로필에서 아이 아이디로 연결하세요.','프로필로 가기','profile.html');
        return;
      }
      await Promise.all(kids.map(loadChild));
      render();
    }catch(e){
      $('content').innerHTML='<div class="empty2">'+esc(permMsg(e))+'</div>';
      if(/permission/i.test((e&&(e.code||e.message))||'')) toast('보안 규칙 게시가 필요해요.');
    }
  });
}
</script>
</body>
</html>
