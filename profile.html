<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프로필</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-home.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F8FD">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<script src="https://unpkg.com/feather-icons"></script>
<style>
:root { --bg:#F2F8FD; --card:#FFFFFF; --ink:#22303C; --sub:#64748B; --line:#D8E6F2; --acc:#1E90FF; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; } }
:root[data-theme="dark"] { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; margin:0; padding:20px; display:flex; flex-direction:column; align-items:center; }
.header { width:100%; max-width:560px; margin-bottom:24px; display:flex; align-items:center; gap:12px; }
.back-btn { width:40px; height:40px; border:1.5px solid var(--line); background:var(--card); border-radius:99px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); }
.back-btn:active { transform:scale(.95); }
h1 { font-family:'Jua',sans-serif; font-weight:400; font-size:32px; margin:0; flex:1; }
.form { background:var(--card); border:2px solid var(--line); border-radius:20px; padding:24px; width:100%; max-width:560px; }
.form-group { margin-bottom:20px; }
label { display:block; font-weight:700; font-size:14px; margin-bottom:8px; }
input, select { width:100%; padding:11px; border:1.5px solid var(--line); border-radius:12px; background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; font-size:14px; }
input:focus, select:focus { outline:none; border-color:var(--acc); }
.btn-group { display:flex; gap:8px; margin-top:24px; }
.btn-group button { flex:1; padding:11px; border:none; border-radius:99px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif; }
.btn-save { background:var(--acc); color:#fff; }
.btn-cancel { background:var(--bg); color:var(--ink); border:1.5px solid var(--line); }
.btn-group button:active { transform:scale(.98); }
.message { text-align:center; color:var(--sub); font-size:13px; margin-top:12px; }
</style>
</head>
<body>
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<div class="header">
  <button class="back-btn" onclick="goBack()"><svg data-feather="chevron-left" width="20" height="20"></svg></button>
  <h1>프로필</h1>
  <a href="index.html" class="back-btn" title="처음으로" style="text-decoration:none; flex:0 0 40px;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
</div>

<div class="form">
  <div class="form-group">
    <label>계정</label>
    <input type="text" id="username" readonly style="background:var(--line); cursor:not-allowed;">
  </div>

  <div class="form-group">
    <label>닉네임</label>
    <input type="text" id="nickname" maxlength="12" placeholder="아이 이름 또는 닉네임">
  </div>

  <div class="form-group">
    <label>생년</label>
    <select id="birthYear"><option value="">선택하세요</option></select>
  </div>

  <div class="form-group">
    <label>나이</label>
    <input type="number" id="age" placeholder="9" min="3" max="18" readonly style="background:var(--line); cursor:not-allowed;">
  </div>

  <div class="form-group">
    <label>역할</label>
    <select id="role">
      <option value="child">아이</option>
      <option value="parent">부모</option>
    </select>
    <div style="font-size:12px;color:var(--sub);margin-top:5px" id="roleHint">부모 역할은 생년이 2007년 이전일 때 선택할 수 있어요</div>
  </div>

  <div class="form-group" id="linkWrap" style="display:none">
    <label>아이 계정 연결</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="childName" placeholder="아이 아이디 입력" autocapitalize="none" autocorrect="off" style="flex:1">
      <button type="button" onclick="linkChild()" style="border:none;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;padding:0 18px;font-family:inherit;cursor:pointer">연결</button>
    </div>
    <div id="childList" style="margin-top:8px"></div>
    <div style="font-size:12px;color:var(--sub);margin-top:4px">연결하면 아이의 계획을 보고 수정할 수 있어요 (체크는 아이만) · <a href="parent.html" style="color:var(--acc)">부모 홈 열기</a></div>
  </div>

  <div class="btn-group">
    <button class="btn-save" onclick="saveProfile()">저장</button>
    <button class="btn-cancel" onclick="goBack()">취소</button>
  </div>

  <div class="message" id="message"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAy889tWquig05QYOEphozzlaTbfiPIbyc",
  authDomain: "halo-kids.firebaseapp.com",
  databaseURL: "https://halo-kids-default-rtdb.firebaseio.com",
  projectId: "halo-kids",
  storageBucket: "halo-kids.firebasestorage.app",
  messagingSenderId: "148528901393",
  appId: "1:148528901393:web:32256a8df7bff9417b30b0"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

window.addEventListener('load', async () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  if (!localStorage.getItem('currentUser')) { window.location.href = 'login.html'; return; }
  firebase.auth().onAuthStateChanged(async (fbUser) => {
  if (!fbUser) { localStorage.removeItem('currentUser'); localStorage.removeItem('username'); localStorage.removeItem('nickname'); window.location.href = 'login.html'; return; }
  const userId = fbUser.uid;
  localStorage.setItem('currentUser', userId);

  const username = localStorage.getItem('username');
  document.getElementById('username').value = username;

  // 사용자 정보 로드
  const snapshot = await db.ref(`users/${userId}`).once('value');
  const user = snapshot.val();

  if (user) {
    document.getElementById('nickname').value = user.nickname || '';
    document.getElementById('birthYear').value = user.birthYear || '';
    if (user.birthYear) {
      const currentYear = new Date().getFullYear();
      document.getElementById('age').value = currentYear - user.birthYear;
    }
    document.getElementById('role').value = (user.role==='parent'||user.role==='admin') ? 'parent' : 'child';
    if (user.role==='admin') document.getElementById('role').disabled = true; // 관리자는 그대로
  }
  gateRole();
  // usernames 인덱스 백필 (기존 계정 자기치유)
  if (username) db.ref(`usernames/${username}`).set(userId).catch(()=>{});
  loadChildren();

  feather.replace();
  });
});

// 생년 연도 목록 (올해 ~ 30년 전) + 선택 시 나이 자동 계산
(() => {
  const sel = document.getElementById('birthYear');
  const thisYear = new Date().getFullYear();
  for (let y = thisYear; y >= 1970; y--) {
    const o = document.createElement('option');
    o.value = y; o.textContent = y + '년';
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => {
    document.getElementById('age').value = sel.value ? (thisYear - parseInt(sel.value)) : '';
    gateRole();
  });
})();

async function saveProfile() {
  const userId = localStorage.getItem('currentUser');
  const nickname = document.getElementById('nickname').value;
  const birthYear = parseInt(document.getElementById('birthYear').value) || null;

  const roleSel = document.getElementById('role');
  const upd = { nickname: nickname, birthYear: birthYear };
  if (!roleSel.disabled) {
    const want = roleSel.value;
    if (want === 'parent' && (!birthYear || birthYear > 2007)) {
      document.getElementById('message').textContent = '부모 역할은 생년 2007년 이전만 가능해요';
      return;
    }
    upd.role = want;
  }
  await db.ref(`users/${userId}`).update(upd);
  gateRole();

  // 아바타 첫 페인트용 캐시도 함께 갱신
  if (nickname) localStorage.setItem('nickname', nickname);
  else localStorage.removeItem('nickname');

  await db.ref(`userActivity/${userId}`).push({
    action: 'update_profile',
    timestamp: firebase.database.ServerValue.TIMESTAMP
  });

  document.getElementById('message').textContent = '저장되었습니다!';
  setTimeout(() => {
    document.getElementById('message').textContent = '';
  }, 2000);
}

function goBack() {
  history.back();
}

function gateRole() {
  const by = parseInt(document.getElementById('birthYear').value) || null;
  const roleSel = document.getElementById('role');
  const adult = by && by <= 2007;
  if (!roleSel.disabled) {
    [...roleSel.options].forEach(o => { if (o.value==='parent') o.disabled = !adult; });
    if (!adult && roleSel.value==='parent') roleSel.value='child';
  }
  const isP = roleSel.value==='parent' || roleSel.disabled; // admin도 연결 UI 표시
  document.getElementById('linkWrap').style.display = isP ? '' : 'none';
}
document.getElementById('role').addEventListener('change', gateRole);

async function loadChildren() {
  const userId = localStorage.getItem('currentUser');
  const box = document.getElementById('childList');
  try {
    const s = await db.ref(`parents/${userId}`).once('value');
    const kids = Object.keys(s.val() || {});
    if (!kids.length) { box.innerHTML=''; return; }
    const rows = await Promise.all(kids.map(async cu => {
      const u = (await db.ref(`users/${cu}`).once('value')).val() || {};
      return { cu, name: u.nickname || u.username || cu.slice(0,6) };
    }));
    box.innerHTML = rows.map(r =>
      `<span style="display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ok);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;margin:0 6px 6px 0">${r.name}<button onclick="unlinkChild('${r.cu}')" style="border:none;background:none;color:var(--sub);cursor:pointer;font-size:13px;padding:0">✕</button></span>`
    ).join('');
  } catch(e) { box.innerHTML = '<span style="font-size:12px;color:var(--sub)">연결 목록을 불러오지 못했어요 (보안 규칙 게시 필요)</span>'; }
}

async function linkChild() {
  const userId = localStorage.getItem('currentUser');
  const name = document.getElementById('childName').value.trim().toLowerCase();
  const msg = document.getElementById('message');
  if (!name) { msg.textContent = '아이 아이디를 입력하세요'; return; }
  if (name === localStorage.getItem('username')) { msg.textContent = '자기 자신은 연결할 수 없어요'; return; }
  try {
    const s = await db.ref(`usernames/${name}`).once('value');
    const cu = s.val();
    if (!cu) { msg.textContent = `'${name}' 계정을 찾을 수 없어요 — 아이 기기에서 한 번 로그인하면 검색돼요`; return; }
    await db.ref(`parents/${userId}/${cu}`).set(true);
    document.getElementById('childName').value='';
    msg.textContent = '연결했어요!';
    loadChildren();
  } catch(e) { msg.textContent = '연결 실패: ' + (e.code||e.message); }
}

async function unlinkChild(cu) {
  const userId = localStorage.getItem('currentUser');
  if (!confirm('이 아이와의 연결을 해제할까요?')) return;
  try { await db.ref(`parents/${userId}/${cu}`).remove(); loadChildren(); } catch(e) {}
}
</script>
</body>
</html>
