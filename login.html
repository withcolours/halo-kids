<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Halo Kids</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Halo Kids">
<link rel="apple-touch-icon" href="icon-home.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F8FD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<script src="https://unpkg.com/feather-icons"></script>
<style>
:root {
  --bg: #F2F8FD;
  --card: #FFFFFF;
  --ink: #22303C;
  --sub: #64748B;
  --line: #D8E6F2;
  --acc: #1E90FF;
  --error: #D6453D;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16202B;
    --card: #1E2A38;
    --ink: #E8EFF6;
    --sub: #93A5B8;
    --line: #2E3E50;
  }
}
:root[data-theme="dark"] {
  --bg: #16202B;
  --card: #1E2A38;
  --ink: #E8EFF6;
  --sub: #93A5B8;
  --line: #2E3E50;
}
* {
  box-sizing: border-box;
}
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans KR', sans-serif;
  margin: 0;
  padding: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}
.container {
  width: 100%;
  max-width: 400px;
}
h1 {
  font-family: 'Jua', sans-serif;
  font-weight: 400;
  font-size: 32px;
  margin: 0 0 6px;
  text-align: center;
}
.subtitle {
  color: var(--sub);
  font-size: 14px;
  text-align: center;
  margin-bottom: 28px;
}
.form-section {
  display: none;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 20px;
  padding: 24px;
  margin-bottom: 16px;
}
.form-section.active {
  display: block;
}
.form-group {
  margin-bottom: 16px;
}
label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 6px;
}
input {
  width: 100%;
  padding: 11px 13px;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  font-family: 'Noto Sans KR', sans-serif;
}
input:focus {
  outline: none;
  border-color: var(--acc);
  box-shadow: 0 0 0 2px rgba(224, 116, 44, 0.1);
}
.error-msg {
  font-size: 12px;
  color: var(--error);
  margin-top: 4px;
  display: none;
}
.error-msg.show {
  display: block;
}
.button-group {
  display: flex;
  gap: 8px;
}
button {
  flex: 1;
  padding: 11px;
  border: none;
  border-radius: 99px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
  transition: all 0.2s;
}
.btn-primary {
  background: var(--acc);
  color: #fff;
}
.btn-primary:active {
  transform: scale(0.98);
  opacity: 0.9;
}
.btn-secondary {
  background: var(--bg);
  color: var(--ink);
  border: 1.5px solid var(--line);
}
.btn-secondary:active {
  transform: scale(0.98);
}
.toggle-group {
  display: flex;
  gap: 8px;
  margin-bottom: 16px;
}
.toggle-btn {
  flex: 1;
  padding: 8px;
  border: 1.5px solid var(--line);
  border-radius: 99px;
  background: var(--bg);
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Noto Sans KR', sans-serif;
}
.toggle-btn.active {
  background: var(--acc);
  color: #fff;
  border-color: var(--acc);
}
.loading {
  display: none;
  text-align: center;
  padding: 20px;
  color: var(--sub);
  font-size: 14px;
}
.loading.show {
  display: block;
}
</style>
</head>
<body>
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>
<div class="container">
  <h1>Halo <span style="color:var(--acc);">Kids!</span></h1>
  <p class="subtitle">오늘은 뭐 읽고, 뭐 볼까? · 로그인해서 시작!</p>

  <!-- 로그인 폼 -->
  <div class="form-section active" id="loginForm">
    <div class="form-group">
      <label>계정</label>
      <input type="text" id="loginUsername" maxlength="20" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="영문, 숫자, _, -, . 만 가능">
      <div class="error-msg" id="loginUsernameError"></div>
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" autocapitalize="none" autocorrect="off" id="loginPassword" maxlength="30" placeholder="최소 5자리">
      <div class="error-msg" id="loginPasswordError"></div>
    </div>
    <div class="error-msg" id="loginError"></div>
    <div class="button-group">
      <button class="btn-primary" onclick="handleLogin()">로그인</button>
      <button class="btn-secondary" onclick="switchForm('signup')">가입</button>
    </div>
  </div>

  <!-- 회원가입 폼 -->
  <div class="form-section" id="signupForm">
    <div class="form-group">
      <label>계정</label>
      <input type="text" id="signupUsername" maxlength="20" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="영문, 숫자, _, -, . 만 가능">
      <div class="error-msg" id="signupUsernameError"></div>
    </div>
    <div class="form-group">
      <label>비밀번호</label>
      <input type="password" autocapitalize="none" autocorrect="off" id="signupPassword" maxlength="30" placeholder="최소 5자리">
      <div class="error-msg" id="signupPasswordError"></div>
    </div>
    <div class="form-group">
      <label>비밀번호 확인</label>
      <input type="password" autocapitalize="none" autocorrect="off" id="signupPasswordConfirm" maxlength="30" placeholder="다시 입력하세요">
      <div class="error-msg" id="signupPasswordConfirmError"></div>
    </div>
    <div class="error-msg" id="signupError"></div>
    <div class="button-group">
      <button class="btn-primary" onclick="handleSignup()">가입하기</button>
      <button class="btn-secondary" onclick="switchForm('login')">돌아가기</button>
    </div>
  </div>

  <!-- 로딩 상태 -->
  <div class="loading" id="loading">처리 중...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
<script>
// Firebase 설정
const firebaseConfig = {
  apiKey: "AIzaSyAy889tWquig05QYOEphozzlaTbfiPIbyc",
  authDomain: "halo-kids.firebaseapp.com",
  databaseURL: "https://halo-kids-default-rtdb.firebaseio.com",
  projectId: "halo-kids",
  storageBucket: "halo-kids.firebasestorage.app",
  messagingSenderId: "148528901393",
  appId: "1:148528901393:web:32256a8df7bff9417b30b0"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

// 테마 초기화
window.addEventListener('load', () => {
  const savedTheme = localStorage.getItem('theme');
  if (savedTheme === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
  feather.replace();
});

// 폼 전환
function switchForm(formType) {
  document.getElementById('loginForm').classList.remove('active');
  document.getElementById('signupForm').classList.remove('active');

  if (formType === 'login') {
    document.getElementById('loginForm').classList.add('active');
    clearErrors();
  } else {
    document.getElementById('signupForm').classList.add('active');
    clearErrors();
  }
}

// 에러 메시지 초기화
function clearErrors() {
  document.querySelectorAll('.error-msg').forEach(el => {
    el.classList.remove('show');
    el.textContent = '';
  });
}

// 유효성 검사: 계정명
function validateUsername(username) {
  const pattern = /^[a-zA-Z0-9._-]+$/;
  if (!username) return '계정을 입력하세요';
  if (!pattern.test(username)) return '영문, 숫자, _, -, .만 가능합니다';
  if (username.length < 3) return '최소 3자리 이상이어야 합니다';
  if (username.length > 20) return '최대 20자까지 가능합니다';
  return '';
}

// 유효성 검사: 비밀번호
function validatePassword(password) {
  if (!password) return '비밀번호를 입력하세요';
  if (password.length < 5) return '최소 5자리 이상이어야 합니다';
  return '';
}

// 로그인
async function handleLogin() {
  clearErrors();
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;

  // 유효성 검사
  let usernameError = validateUsername(username);
  let passwordError = validatePassword(password);

  if (usernameError) {
    document.getElementById('loginUsernameError').textContent = usernameError;
    document.getElementById('loginUsernameError').classList.add('show');
  }
  if (passwordError) {
    document.getElementById('loginPasswordError').textContent = passwordError;
    document.getElementById('loginPasswordError').classList.add('show');
  }

  if (usernameError || passwordError) return;

  setLoading(true);

  try {
    // Firebase Auth 사용 (이메일 방식)
    const email = `${username}@halo-kids.local`;
    const userCred = await auth.signInWithEmailAndPassword(email, password);

    // 활동 로그
    await db.ref(`userActivity/${userCred.user.uid}`).push({
      action: 'login',
      timestamp: firebase.database.ServerValue.TIMESTAMP
    });

    // localStorage에 저장
    localStorage.setItem('currentUser', userCred.user.uid);
    localStorage.setItem('username', username);

    // index.html로 리다이렉트
    window.location.href = 'index.html';
  } catch (error) {
    let errorMsg = '로그인 실패했습니다';
    if (error.code === 'auth/user-not-found') {
      errorMsg = '존재하지 않는 계정입니다';
    } else if (error.code === 'auth/wrong-password') {
      errorMsg = '잘못된 비밀번호입니다';
    }
    document.getElementById('loginError').textContent = errorMsg;
    document.getElementById('loginError').classList.add('show');
  }

  setLoading(false);
}

// 회원가입
async function handleSignup() {
  clearErrors();
  const username = document.getElementById('signupUsername').value.trim();
  const password = document.getElementById('signupPassword').value;
  const passwordConfirm = document.getElementById('signupPasswordConfirm').value;

  // 유효성 검사
  let usernameError = validateUsername(username);
  let passwordError = validatePassword(password);
  let passwordConfirmError = '';

  if (password !== passwordConfirm) {
    passwordConfirmError = '비밀번호가 일치하지 않습니다';
  }

  if (usernameError) {
    document.getElementById('signupUsernameError').textContent = usernameError;
    document.getElementById('signupUsernameError').classList.add('show');
  }
  if (passwordError) {
    document.getElementById('signupPasswordError').textContent = passwordError;
    document.getElementById('signupPasswordError').classList.add('show');
  }
  if (passwordConfirmError) {
    document.getElementById('signupPasswordConfirmError').textContent = passwordConfirmError;
    document.getElementById('signupPasswordConfirmError').classList.add('show');
  }

  if (usernameError || passwordError || passwordConfirmError) return;

  setLoading(true);

  try {
    // Firebase Auth 사용
    const email = `${username}@halo-kids.local`;
    const userCred = await auth.createUserWithEmailAndPassword(email, password);
    const uid = userCred.user.uid;

    // users DB에 저장
    await db.ref(`users/${uid}`).set({
      username: username,
      nickname: '',
      birthYear: null,
      role: 'child',
      createdAt: firebase.database.ServerValue.TIMESTAMP,
      lastLogin: firebase.database.ServerValue.TIMESTAMP
    });

    // 활동 로그
    await db.ref(`userActivity/${uid}`).push({
      action: 'signup',
      timestamp: firebase.database.ServerValue.TIMESTAMP
    });

    // localStorage에 저장
    localStorage.setItem('currentUser', uid);
    localStorage.setItem('username', username);

    // index.html로 리다이렉트
    window.location.href = 'index.html';
  } catch (error) {
    let errorMsg = '가입에 실패했습니다';
    if (error.code === 'auth/email-already-in-use') {
      errorMsg = '이미 존재하는 계정입니다';
    }
    document.getElementById('signupError').textContent = errorMsg;
    document.getElementById('signupError').classList.add('show');
  }

  setLoading(false);
}

// 로딩 상태
function setLoading(isLoading) {
  document.getElementById('loading').classList.toggle('show', isLoading);
  document.querySelectorAll('button').forEach(btn => {
    btn.disabled = isLoading;
  });
}
// 계정 입력은 항상 소문자
['loginUsername', 'signupUsername'].forEach(id => {
  document.getElementById(id).addEventListener('input', e => {
    const p = e.target.selectionStart;
    e.target.value = e.target.value.toLowerCase();
    e.target.setSelectionRange(p, p);
  });
});

// Enter 키로 제출
['loginUsername', 'loginPassword'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
});
['signupUsername', 'signupPassword', 'signupPasswordConfirm'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => {
    if (e.key === 'Enter') handleSignup();
  });
});
</script>
</body>
</html>
