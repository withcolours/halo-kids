<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>보상 상점</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-home.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F2F8FD">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root { --bg:#F2F8FD; --card:#FFFFFF; --ink:#22303C; --sub:#64748B; --line:#D8E6F2; --acc:#1E90FF; --ok:#2E9E5B; --gold:#C99A16; --warn:#E0742C; --bad:#D6453D; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; } }
:root[data-theme="dark"] { --bg:#16202B; --card:#1E2A38; --ink:#E8EFF6; --sub:#93A5B8; --line:#2E3E50; }
* { box-sizing:border-box; }
body { background:var(--bg); color:var(--ink); font-family:'Noto Sans KR',sans-serif; margin:0; padding:18px 16px 60px; display:flex; flex-direction:column; align-items:center; }
.header { width:100%; max-width:560px; margin-bottom:14px; display:flex; align-items:center; gap:10px; }
.hbtn { width:40px; height:40px; border:1.5px solid var(--line); background:var(--card); border-radius:99px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink); flex:0 0 40px; text-decoration:none; }
.hbtn:active { transform:scale(.95); }
h1 { font-family:'Jua',sans-serif; font-weight:400; font-size:26px; margin:0; flex:1; }
.svgi { width:20px; height:20px; }
main { width:100%; max-width:560px; }
.balance { background:var(--card); border:2px solid var(--gold); border-radius:18px; padding:14px 18px; display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.balance b { font-family:'Jua',sans-serif; font-size:26px; font-weight:400; color:var(--gold); }
.balance .sub2 { font-size:11.5px; color:var(--sub); }
.item { display:flex; align-items:center; gap:12px; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:13px 14px; margin-bottom:8px; }
.item .ic { width:34px; height:34px; flex:0 0 34px; display:flex; align-items:center; justify-content:center; color:var(--acc); }
.item .ic svg { width:26px; height:26px; }
.item .tx { flex:1; min-width:0; }
.item .tt { font-size:14.5px; font-weight:700; }
.item .st { font-size:12px; color:var(--gold); font-weight:700; margin-top:1px; }
.buy { border:none; border-radius:99px; padding:9px 16px; font-size:13px; font-weight:700; font-family:inherit; cursor:pointer; background:var(--acc); color:#fff; white-space:nowrap; }
.buy:disabled { background:var(--line); color:var(--sub); cursor:default; }
.sect { font-size:12.5px; font-weight:700; color:var(--sub); margin:20px 0 8px; display:flex; align-items:center; gap:8px; }
.rulecard { background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:12px 15px; font-size:12.5px; line-height:1.8; color:var(--sub); margin-bottom:8px; }
.rulecard b { color:var(--ink); font-size:14px; }
.badge { font-size:11px; font-weight:700; border-radius:99px; padding:3px 9px; white-space:nowrap; }
.badge.req { background:#E0742C22; color:var(--warn); border:1px solid var(--warn); }
.badge.ok { background:#2E9E5B22; color:var(--ok); border:1px solid var(--ok); }
.badge.no { background:#D6453D22; color:var(--bad); border:1px solid var(--bad); }
.mini { border:1.5px solid var(--line); background:var(--card); color:var(--ink); border-radius:99px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer; font-family:inherit; }
.mini.ok { border-color:var(--ok); color:var(--ok); }
.mini.no { border-color:var(--bad); color:var(--bad); }
.empty2 { font-size:13px; color:var(--sub); text-align:center; padding:18px 0; }
.seedbtn { display:block; width:100%; border:1.5px dashed var(--line); background:transparent; color:var(--sub); border-radius:14px; padding:14px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(20px); background:#1f2937; color:#fff; border-radius:12px; padding:11px 16px; font-size:13px; opacity:0; pointer-events:none; transition:.2s; z-index:99; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>
<script>(function(){var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);})();</script>

<div class="header">
  <button class="hbtn" onclick="history.back()" aria-label="뒤로"><svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>
  <h1>보상 상점</h1>
  <a href="today.html" class="hbtn" title="오늘"><svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/><path d="M8 14l3 3 5-6"/></svg></a>
  <a href="index.html" class="hbtn" title="처음으로"><svg class="svgi" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
</div>

<main>
  <div class="balance">
    <b id="bal">⭐ –</b>
    <span style="flex:1">
      <div style="font-size:13px; font-weight:700;">쓸 수 있는 별</div>
      <div class="sub2" id="balSub">모은 별 – · 쓴 별 –</div>
    </span>
  </div>

  <div class="sect">상품</div>
  <div id="shopList"><div class="empty2">불러오는 중…</div></div>

  <div class="sect">내 교환 신청</div>
  <div id="reqList"><div class="empty2">아직 신청한 게 없어요.</div></div>

  <div id="adminWrap" style="display:none">
    <div class="sect">승인 대기 (관리자)</div>
    <div id="adminList"><div class="empty2">대기 중인 신청이 없어요.</div></div>
  </div>

  <div class="sect">별 모으는 법</div>
  <div class="rulecard">
    하루 계획 <b>전부 완료 ⭐2</b> · 절반 이상 <b>⭐1</b><br>
    한 주에 5일을 완수하면 보너스 <b>⭐5</b><br>
    교환을 신청하면 부모님 승인 후 별이 사용돼요.
  </div>
</main>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAy889tWquig05QYOEphozzlaTbfiPIbyc",
  authDomain: "halo-kids.firebaseapp.com",
  databaseURL: "https://halo-kids-default-rtdb.firebaseio.com",
  projectId: "halo-kids",
  storageBucket: "halo-kids.firebasestorage.app",
  messagingSenderId: "148528901393",
  appId: "1:148528901393:web:32256a8df7bff9417b30b0"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY = () => ymd(new Date());
function addDays(dstr,n){ const d=new Date(dstr+'T00:00:00'); d.setDate(d.getDate()+n); return ymd(d); }
function kindOf(t){ return t && t.kind==='routine' ? 'routine' : 'todo'; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c)); }
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove('show'),2600); }

const ICONS = {
  game: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.544-.604-6.584-.702-7.41A4 4 0 0 0 17.32 5z"/><path d="M6 11h4"/><path d="M8 9v4"/><circle cx="15.5" cy="12.5" r=".5" fill="currentColor"/><circle cx="18" cy="10" r=".5" fill="currentColor"/></svg>',
  tv: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/></svg>',
  book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
  gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>'
};
const SEED = [
  { title:'주말 게임 1시간 (기본권)', star:10, icon:'game' },
  { title:'게임 +10분', star:2, icon:'game' },
  { title:'게임 +30분', star:5, icon:'game' },
  { title:'주말 영상 30분', star:4, icon:'tv' },
  { title:'주말 영상 1시간', star:7, icon:'tv' },
  { title:'서점에서 아무 책 1권', star:8, icon:'book' }
];

let uid=null, isAdmin=false, earned=0, spent=0, rewards={}, reds={};

async function calcEarned(){
  const [wS,cS]=await Promise.all([
    db.ref(`userPlanWeeks/${uid}`).once('value'),
    db.ref(`userPlanChecks/${uid}`).once('value')
  ]);
  const weeks=wS.val()||{}, checks=cS.val()||{};
  let total=0; const weekFull={};
  for(const [ws,w] of Object.entries(weeks)){
    const tasks=w.tasks||[];
    for(let i=0;i<7;i++){
      const date=addDays(ws,i);
      if(date>TODAY())continue;
      const dayTodos=tasks.filter(t=>(t.days||[]).includes(i)&&kindOf(t)==='todo');
      if(!dayTodos.length)continue;
      const dc=checks[date]||{};
      const done=dayTodos.filter(t=>dc[t.id]).length;
      if(done===dayTodos.length){ total+=2; weekFull[ws]=(weekFull[ws]||0)+1; }
      else if(done*2>=dayTodos.length){ total+=1; }
    }
  }
  for(const n of Object.values(weekFull)) if(n>=5) total+=5;
  return total;
}

function balance(){ return earned-spent; }

function renderBalance(){
  $('bal').textContent='⭐ '+balance();
  $('balSub').textContent=`모은 별 ${earned} · 쓴 별 ${spent}`;
  renderShop();
}

function renderShop(){
  const box=$('shopList');
  const entries=Object.entries(rewards);
  if(!entries.length){
    box.innerHTML='<button class="seedbtn" id="seedBtn">기본 상품 채우기 (게임·영상·서점)</button>';
    const b=$('seedBtn'); if(b)b.onclick=seedRewards;
    return;
  }
  entries.sort((a,b)=>a[1].star-b[1].star);
  box.innerHTML=entries.map(([id,r])=>{
    const can=balance()>=r.star;
    return `<div class="item"><span class="ic">${ICONS[r.icon]||ICONS.gift}</span>
      <span class="tx"><div class="tt">${esc(r.title)}</div><div class="st">⭐ ${r.star}</div></span>
      <button class="buy" data-id="${id}" ${can?'':'disabled'}>${can?'교환':'별 부족'}</button></div>`;
  }).join('');
}

async function seedRewards(){
  const upd={};
  SEED.forEach(r=>{ upd[db.ref().push().key]=r; });
  try{ await db.ref(`rewards/${uid}`).update(upd); rewards={...rewards,...upd}; renderShop(); toast('기본 상품을 채웠어요. 필요하면 관리자 화면에서 조정할 수 있어요.'); }
  catch(e){ toast('저장 실패: 보안 규칙 게시가 필요할 수 있어요 ('+(e.code||e.message)+')'); }
}

function renderReqs(){
  const box=$('reqList');
  const entries=Object.entries(reds).sort((a,b)=>(b[1].reqAt||0)-(a[1].reqAt||0));
  if(!entries.length){ box.innerHTML='<div class="empty2">아직 신청한 게 없어요.</div>'; return; }
  box.innerHTML=entries.map(([id,r])=>{
    const bd=r.status==='approved'?'<span class="badge ok">승인됨</span>':r.status==='rejected'?'<span class="badge no">거절됨</span>':'<span class="badge req">승인 대기</span>';
    const cancel=r.status==='requested'?`<button class="mini no" data-cancel="${id}">취소</button>`:'';
    return `<div class="item"><span class="tx"><div class="tt">${esc(r.title)}</div><div class="st">⭐ ${r.star}</div></span>${bd}${cancel}</div>`;
  }).join('');
}

async function loadAdmin(){
  if(!isAdmin)return;
  try{
    const [rS,uS]=await Promise.all([db.ref('redemptions').once('value'),db.ref('users').once('value')]);
    const all=rS.val()||{}, users=uS.val()||{};
    const rows=[];
    for(const [u,items] of Object.entries(all))
      for(const [id,r] of Object.entries(items))
        if(r.status==='requested')rows.push({u,id,r,name:(users[u]&&(users[u].nickname||users[u].username))||u.slice(0,6)});
    $('adminWrap').style.display='';
    $('adminList').innerHTML=rows.length?rows.map(x=>
      `<div class="item"><span class="tx"><div class="tt">${esc(x.name)} · ${esc(x.r.title)}</div><div class="st">⭐ ${x.r.star}</div></span>
      <button class="mini ok" data-ap="${x.u}/${x.id}">승인</button><button class="mini no" data-rj="${x.u}/${x.id}">거절</button></div>`
    ).join(''):'<div class="empty2">대기 중인 신청이 없어요.</div>';
  }catch(e){ /* admin 아님 or 규칙 미게시 */ }
}

document.addEventListener('click', async e=>{
  const buy=e.target.closest('.buy[data-id]');
  if(buy&&!buy.disabled){
    const id=buy.dataset.id, r=rewards[id];
    if(balance()<r.star){ toast('별이 부족해요.'); return; }
    try{
      const key=db.ref().push().key;
      const red={rewardId:id,title:r.title,star:r.star,status:'requested',reqAt:firebase.database.ServerValue.TIMESTAMP};
      await db.ref(`redemptions/${uid}/${key}`).set(red);
      reds[key]={...red,reqAt:Date.now()};
      renderReqs(); toast('신청했어요! 부모님 승인을 기다려요.');
    }catch(err){ toast('신청 실패: '+(err.code||err.message)); }
    return;
  }
  const cc=e.target.closest('[data-cancel]');
  if(cc){
    const id=cc.dataset.cancel;
    try{ await db.ref(`redemptions/${uid}/${id}`).remove(); delete reds[id]; renderReqs(); toast('신청을 취소했어요.'); }
    catch(err){ toast('취소 실패: '+(err.code||err.message)); }
    return;
  }
  const ap=e.target.closest('[data-ap]'), rj=e.target.closest('[data-rj]');
  if(ap||rj){
    const [u,id]=(ap||rj).dataset[ap?'ap':'rj'].split('/');
    const status=ap?'approved':'rejected';
    try{
      await db.ref(`redemptions/${u}/${id}`).update({status,decidedAt:firebase.database.ServerValue.TIMESTAMP});
      toast(ap?'승인했어요.':'거절했어요.');
      if(u===uid){ const s=await db.ref(`redemptions/${uid}`).once('value'); reds=s.val()||{}; spent=Object.values(reds).filter(x=>x.status==='approved').reduce((a,x)=>a+(x.star||0),0); renderBalance(); renderReqs(); }
      loadAdmin();
    }catch(err){ toast('처리 실패: '+(err.code||err.message)); }
  }
});

if(!localStorage.getItem('currentUser')){
  window.location.href='login.html';
}else{
  auth.onAuthStateChanged(async user=>{
    if(!user){ window.location.href='login.html'; return; }
    uid=user.uid;
    try{
      const [me,rw,rd]=await Promise.all([
        db.ref(`users/${uid}`).once('value'),
        db.ref(`rewards/${uid}`).once('value'),
        db.ref(`redemptions/${uid}`).once('value')
      ]);
      isAdmin=(me.val()||{}).role==='admin';
      rewards=rw.val()||{}; reds=rd.val()||{};
      spent=Object.values(reds).filter(x=>x.status==='approved').reduce((a,x)=>a+(x.star||0),0);
      earned=await calcEarned();
      renderBalance(); renderReqs(); loadAdmin();
    }catch(e){
      const msg=(e&&(e.code||e.message))||String(e);
      $('shopList').innerHTML='<div class="empty2">'+(/permission/i.test(msg)?'보안 규칙이 아직 게시되지 않았어요 — 게시 후 새로고침해 주세요.':'불러오지 못했어요: '+esc(msg))+'</div>';
    }
  });
}
</script>
</body>
</html>
